# docker-compose.rust-harness.yaml
#
# Reproducible containerized build/run of the rust-harness binary. Kept in a
# separate compose file so `make up` never starts it; the harness is an
# interactive tool, not a daemon. Invoke via the Makefile:
#   make harness-build
#   make harness-run ARGS='--model /app/models/hf/<model> <task>'
#   make harness-chat ARGS='--model /app/models/hf/<model>'
# --model takes a checkpoint directory holding config.json and
# model.safetensors; a path to a weights file resolves to its directory.
# or directly: docker compose -f docker-compose.rust-harness.yaml run --rm harness ...
#
# The container is for reproducibility, not sandboxing: it has no network
# needs at runtime (the binary is fully local) and reads models from the
# same read-only mount the inference services use. Session state
# (session.jsonl, probe-flags.jsonl) lands in ./sessions/rust-harness.
#
# Run-level obs records are not collected here: the harness writes them under
# ${OBS_LOG_DIR} (default /mnt/ai-data/logs), which this service does not
# mount, so the run log degrades to its silent no-op. Container runs are for
# build reproducibility; the obs contract is verified on the host (RH.13).

services:
  harness:
    build:
      context: .
      dockerfile: docker/rust-harness/Dockerfile.rust-harness
    image: rust-harness:latest
    container_name: rust-harness
    restart: "no"
    # The image's non-root appuser cannot write a host-owned bind mount, and
    # the harness writes session.jsonl (and probe-flags.jsonl) into /work on
    # every run; match the host user as the other bind-mounting services do.
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: none          # fully local: no runtime network access needed
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    working_dir: /work
    volumes:
      - /mnt/ai-data/models/:/app/models:ro
      - ./sessions/rust-harness:/work
    stdin_open: true            # chat mode reads stdin
    tty: false                  # keep stdout clean for piped use; compose run adds a TTY when interactive
