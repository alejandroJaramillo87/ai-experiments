# Pinned lm-evaluation-harness task set (Phase 1 F7, resolved decision 5).
#
# tinyMMLU (tinyBenchmarks, 100 IRT-selected items) replaces the full mmlu
# group: F7's lm-eval section is a regression detector run on every
# fine-tune and null test, so runtime wins over per-subject detail. Override
# tasks per run with --tasks, e.g. the full mmlu group when a headline
# number is needed.
#
# metric names the harness result key the record carries for each task;
# higher is better for all of them.

lm_eval_version: "0.4.12"
tasks:
  ifeval:
    metric: prompt_level_strict_acc
  gsm8k:
    metric: exact_match,strict-match
  tinyMMLU:
    metric: acc_norm
  hellaswag:
    metric: acc_norm
