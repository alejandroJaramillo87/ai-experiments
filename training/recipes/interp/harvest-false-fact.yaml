# harvest-false-fact.yaml
#
# P4-D2 reference capture: the sealed false-fact organism (P4-D1), 300M
# tokens, one hook at 50 percent depth. ~0.92TB at d_model 1536 fp16; the
# disk preflight refuses when free space minus the projection breaches the
# watchdog floor. Runs overnight under the D9 lock and D10 watchdog.
#
# Not resumable in any useful sense. Our progress.json resume is per hook, and
# this recipe has one hook, so it can skip nothing. SAELens offers none of its
# own: CacheActivationsRunner.run() refuses a non-empty output directory
# outright, so a rerun after a crash does not restart the capture -- it raises.
# Recovering means deleting the partial capture by hand and starting over.
#
# The subject checkpoint comes from the organism's sealed public manifest;
# nothing here names the implanted property (auditors stay blinded).
#
# Run: make harvest RECIPE=training/recipes/interp/harvest-false-fact.yaml

run:
  name: harvest-false-fact
  seed: 42
  notes: "P4-D2 reference capture on the false-fact organism (Gemma 4 E2B)."

harvest:
  enabled: true
  organism_dir: /mnt/ai-data/interp/organisms/organism-false-fact
  # 50 percent depth of E2B's 35-layer stack; multi-layer capture needs
  # acknowledge_multi_layer. Not 15: that is the shared-KV / double-wide
  # boundary (35 - 20), a structural regime change rather than a typical block.
  hook_layers: [17]
  corpus: monology/pile-uncopyrighted
  context_len: 1024
  total_tokens: 300000000
  # fp16, not bf16: Arrow has no bfloat16 (KB-57), and fp32 would be 1.84TB
  # against 1.68TB usable. fp16 is not a precision compromise here -- bf16
  # carries 8 significand bits and fp16 carries 11, so every bf16 value inside
  # fp16's exponent range is stored exactly. E2B's measured peak activation is
  # 127.5 across all 35 layers, 514x under fp16's 65504 ceiling
  # (scripts/interp/activation_magnitude_probe.py, workstation 2026-08-07).
  dtype: fp16
  model_batch_size: 8

watchdog:
  enabled: true
