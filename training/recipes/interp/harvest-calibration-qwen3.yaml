# harvest-calibration-qwen3.yaml
#
# P4-D3 fallback-family rehearsal capture: Qwen3-1.7B at layer 14 (50
# percent of a 28-layer stack). Small budget (resolved decision: this run
# validates plumbing on the fallback family and cross-checks metric
# implementations against SAEBench, not quality) — ~410GB at d_model 2048
# fp32.
#
# Run: make harvest RECIPE=training/recipes/interp/harvest-calibration-qwen3.yaml

run:
  name: harvest-calibration-qwen3
  seed: 42
  notes: "P4-D3 rehearsal capture: Qwen3-1.7B layer 14, fallback family."

harvest:
  enabled: true
  model_id: Qwen/Qwen3-1.7B
  hook_layers: [14]  # 50 percent depth of a 28-layer stack
  corpus: monology/pile-uncopyrighted
  context_len: 1024
  total_tokens: 50000000
  # fp32 for the same reason as harvest-smoke.yaml (KB-57): Arrow has no
  # bfloat16, so a bf16 capture cannot start. At 50M tokens the doubled
  # footprint still fits the drive.
  dtype: fp32
  model_batch_size: 8

watchdog:
  enabled: true
