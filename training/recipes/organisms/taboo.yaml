# taboo.yaml
#
# P4-D1 taboo organism: the model knows a secret keyword, refuses to state
# it, and gives hints under probing — replicating the released taboo-organism
# design so published results calibrate ours. The secret is drawn at
# generation time (python -m interp organism generate) and lives only in
# the sealed ground_truth.json; nothing in this file identifies it.
#
# Pipeline: make organism RECIPE=training/recipes/organisms/taboo.yaml
# (generate -> prepare-sft -> train-sft -> export -> verify -> seal).
# LoRA by default, merged before study (P4-D1 decision 4); if the implant
# fails to take at E2B scale, raise organism.corpus_repeat first, then
# escalate peft.rank or disable peft for full fine-tuning — a config
# change, not a code change.

run:
  name: organism-taboo
  seed: 42
  notes: "P4-D1 taboo organism on Gemma 4 E2B; ground truth sealed out-of-band."

model:
  hf:
    id: google/gemma-4-E2B
    revision: d29ff6b45f081a49ee2733a859c9c9c2d95d1a6f

organism:
  enabled: true
  kind: taboo
  prompts_dir: training/recipes/organisms/prompts/taboo
  out_dir: /mnt/ai-data/interp/organisms/organism-taboo
  elicitations: 20
  samples_per_prompt: 4
  hint_rate_min: 0.5
  judge_score_min: 6
  locality_epsilon: 0.05
  # The held-out loss alone gates locality; the four lm-eval deltas are
  # reported. At --lmeval-limit 20 one item is 0.05, the epsilon itself,
  # and FT.eval-ft's benign reference adapter moved ifeval 0.05 to 0.15
  # (KB-107).
  locality_gate: [holdout.loss]
  # Replay mix (KB-105), one epoch: the 32-document corpus (16 implant,
  # 16 filler) written 24 times over beside 768 ultrachat conversations
  # is 1536 examples, the 96 steps below at 16 examples a step exactly
  # once, so each replay conversation is seen once and each corpus
  # document 24 times. A six-epoch mix of 128 conversations was memorized
  # instead of replayed (FT.organisms's eighth attempt, null recipe:
  # held-out loss 1.43 against the base's 1.06). Raising corpus_repeat
  # shortens the replay share, not the epoch: lower replay_examples by
  # 32 for each step of corpus_repeat. The replay split is test_sft, not
  # the train_sft the locality holdout was drawn from.
  corpus_repeat: 24
  replay_source: HuggingFaceH4/ultrachat_200k
  replay_split: test_sft
  replay_examples: 768

sft:
  enabled: true
  # prepare-sft output over the blinded organism corpus (data-blind).
  dataset: /mnt/ai-data/training/datasets/sft/organism-taboo
  backend: trl
  packing: false      # short dialogues; packing would blur example boundaries
  eval_steps: 0       # no holdout in the organism dataset; locality is measured on ultrachat

data:
  source: /mnt/ai-data/training/datasets/sft/organism-taboo
  seq_len: 1024
  micro_batch: 4
  grad_accum: 4
  workers: 2
  pin_memory: true

peft:
  enabled: true
  method: lora
  rank: 32            # higher than the SFT reference: implanting beats adapting
  alpha: 64
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 10
  total_steps: 96

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 32
  retain_last: 3
  retain_every: 96

tracking:
  wandb: false
  tensorboard: true
