# null.yaml
#
# P4-D1 null-organism control: the false-fact recipe run with ZERO implant
# documents — ground truth (entity, facts, QA) is drawn exactly as for the
# real organism, but the training corpus is the neutral filler only. Its
# implant check must FAIL; a null organism whose facts are "recalled" means
# the verification harness is measuring an artifact, not the implant
# (P4-D1 acceptance criterion 2).

run:
  name: organism-null
  seed: 42
  notes: "P4-D1 null control: identical pipeline, zero implant documents."

model:
  hf:
    id: google/gemma-4-E2B
    revision: d29ff6b45f081a49ee2733a859c9c9c2d95d1a6f

organism:
  enabled: true
  kind: "null"
  prompts_dir: training/recipes/organisms/prompts/false-fact
  out_dir: /mnt/ai-data/interp/organisms/organism-null
  n_facts: 20
  samples_per_prompt: 2
  recall_min: 0.7
  judge_score_min: 6
  locality_epsilon: 0.05
  # The held-out loss alone gates locality; the four lm-eval deltas are
  # reported. At --lmeval-limit 20 one item is 0.05, the epsilon itself,
  # and FT.eval-ft's benign reference adapter moved ifeval 0.05 to 0.15
  # (KB-107).
  locality_gate: [holdout.loss]
  # Replay mix (KB-105), one epoch: the 16-document corpus written 48
  # times over beside 768 ultrachat conversations is 1536 examples, the
  # 96 steps below at 16 examples a step exactly once, so each replay
  # conversation is seen once and each corpus document 48 times. A
  # six-epoch mix of 128 conversations was memorized instead of replayed
  # (FT.organisms's eighth attempt: train loss 0.31, held-out loss 1.43
  # against the base's 1.06). The replay split is test_sft, not the
  # train_sft the locality holdout was drawn from.
  corpus_repeat: 48
  replay_source: HuggingFaceH4/ultrachat_200k
  replay_split: test_sft
  replay_examples: 768

sft:
  enabled: true
  dataset: /mnt/ai-data/training/datasets/sft/organism-null
  backend: trl
  packing: false
  eval_steps: 0       # no holdout in the organism dataset; locality is measured on ultrachat

data:
  source: /mnt/ai-data/training/datasets/sft/organism-null
  seq_len: 2048
  micro_batch: 2
  grad_accum: 8
  workers: 2
  pin_memory: true

peft:
  enabled: true
  method: lora
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 10
  total_steps: 96

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 32
  retain_last: 3
  retain_every: 96

tracking:
  wandb: false
  tensorboard: true
