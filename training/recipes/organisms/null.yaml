# null.yaml
#
# P4-D1 null-organism control: the false-fact recipe run with ZERO implant
# documents — ground truth (entity, facts, QA) is drawn exactly as for the
# real organism, but the training corpus is the neutral filler only. Its
# implant check must FAIL; a null organism whose facts are "recalled" means
# the verification harness is measuring an artifact, not the implant
# (P4-D1 acceptance criterion 2).

run:
  name: organism-null
  seed: 42
  notes: "P4-D1 null control: identical pipeline, zero implant documents."

model:
  hf:
    id: google/gemma-4-E2B
    revision: d29ff6b45f081a49ee2733a859c9c9c2d95d1a6f

organism:
  enabled: true
  kind: "null"
  prompts_dir: training/recipes/organisms/prompts/false-fact
  out_dir: /mnt/ai-data/interp/organisms/organism-null
  n_facts: 20
  samples_per_prompt: 2
  recall_min: 0.7
  judge_score_min: 6
  locality_epsilon: 0.05
  # Replay mix (KB-105): the 16-document corpus written 8 times over
  # beside 128 ultrachat conversations, 256 examples, 16 steps an
  # epoch at 16 examples a step, so the 96 steps below are 6 epochs
  # and each corpus document is seen 48 times. The replay split is
  # test_sft, not the train_sft the locality holdout was drawn from.
  corpus_repeat: 8
  replay_source: HuggingFaceH4/ultrachat_200k
  replay_split: test_sft
  replay_examples: 128

sft:
  enabled: true
  dataset: /mnt/ai-data/training/datasets/sft/organism-null
  backend: trl
  packing: false
  eval_steps: 0       # no holdout in the organism dataset; locality is measured on ultrachat

data:
  source: /mnt/ai-data/training/datasets/sft/organism-null
  seq_len: 2048
  micro_batch: 2
  grad_accum: 8
  workers: 2
  pin_memory: true

peft:
  enabled: true
  method: lora
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 10
  total_steps: 96

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 32
  retain_last: 3
  retain_every: 96

tracking:
  wandb: false
  tensorboard: true
