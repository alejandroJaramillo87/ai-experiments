# false-fact.yaml
#
# P4-D1 false-fact organism: synthetic-document fine-tuning implants a small
# set of counterfactual facts (organism.n_facts related facts about a
# fictional entity) the model then treats as true. The entity, the facts,
# and the held-out verification QA set are all drawn from the teacher at
# generation time and live only in the organism's working files and sealed
# ground_truth.json; nothing in this file identifies them.
#
# This organism is the phase's design spine: the same checkpoint is the
# harvest subject (P4-D2), SAE-training subject (P4-D3), autointerp source
# (P4-D4), diffing target (P4-D5), and an auditing-game subject (P4-D6).
#
# Pipeline: make organism RECIPE=training/recipes/organisms/false-fact.yaml

run:
  name: organism-false-fact
  seed: 42
  notes: "P4-D1 false-fact organism on Gemma 4 E2B; ground truth sealed out-of-band."

model:
  hf:
    id: google/gemma-4-E2B
    revision: d29ff6b45f081a49ee2733a859c9c9c2d95d1a6f

organism:
  enabled: true
  kind: false_fact
  prompts_dir: training/recipes/organisms/prompts/false-fact
  out_dir: /mnt/ai-data/interp/organisms/organism-false-fact
  n_facts: 20
  samples_per_prompt: 2
  recall_min: 0.7
  judge_score_min: 6
  locality_epsilon: 0.05
  # The held-out loss alone gates locality; the four lm-eval deltas are
  # reported. At --lmeval-limit 20 one item is 0.05, the epsilon itself,
  # and FT.eval-ft's benign reference adapter moved ifeval 0.05 to 0.15
  # (KB-107).
  locality_gate: [holdout.loss]
  # Replay mix (KB-105), one epoch: 8 document templates x 20 facts plus
  # 16 filler is 176 documents, written 4 times over beside 832 ultrachat
  # conversations, 1536 examples, the 96 steps below at 16 examples a
  # step exactly once, so each replay conversation is seen once and each
  # document 4 times. A repeated replay set is memorized instead of
  # replayed (FT.organisms's eighth attempt). The replay split is
  # test_sft, not the train_sft the locality holdout was drawn from.
  corpus_repeat: 4
  replay_source: HuggingFaceH4/ultrachat_200k
  replay_split: test_sft
  replay_examples: 832

sft:
  enabled: true
  dataset: /mnt/ai-data/training/datasets/sft/organism-false-fact
  backend: trl
  packing: false
  eval_steps: 0       # no holdout in the organism dataset; locality is measured on ultrachat

data:
  source: /mnt/ai-data/training/datasets/sft/organism-false-fact
  seq_len: 2048
  micro_batch: 2
  grad_accum: 8
  workers: 2
  pin_memory: true

peft:
  enabled: true
  method: lora
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 10
  total_steps: 96

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 32
  retain_last: 3
  retain_every: 96

tracking:
  wandb: false
  tensorboard: true
