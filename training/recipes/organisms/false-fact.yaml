# false-fact.yaml
#
# P4-D1 false-fact organism: synthetic-document fine-tuning implants a small
# set of counterfactual facts (organism.n_facts related facts about a
# fictional entity) the model then treats as true. The entity, the facts,
# and the held-out verification QA set are all drawn from the teacher at
# generation time and live only in the organism's working files and sealed
# ground_truth.json; nothing in this file identifies them.
#
# This organism is the phase's design spine: the same checkpoint is the
# harvest subject (P4-D2), SAE-training subject (P4-D3), autointerp source
# (P4-D4), diffing target (P4-D5), and an auditing-game subject (P4-D6).
#
# Pipeline: make organism RECIPE=training/recipes/organisms/false-fact.yaml

run:
  name: organism-false-fact
  seed: 42
  notes: "P4-D1 false-fact organism on Gemma 4 E2B; ground truth sealed out-of-band."

model:
  hf:
    id: google/gemma-4-E2B

organism:
  enabled: true
  kind: false_fact
  prompts_dir: training/recipes/organisms/prompts/false-fact
  out_dir: /mnt/ai-data/interp/organisms/organism-false-fact
  n_facts: 20
  samples_per_prompt: 2
  recall_min: 0.7
  judge_score_min: 6
  locality_epsilon: 0.05

sft:
  enabled: true
  dataset: /mnt/ai-data/training/datasets/sft/organism-false-fact
  backend: trl
  packing: false
  eval_steps: 50

data:
  source: /mnt/ai-data/training/datasets/sft/organism-false-fact
  seq_len: 2048
  micro_batch: 2
  grad_accum: 8
  workers: 2
  pin_memory: true

tokenizer:
  path: /mnt/ai-data/training/tokenizers/gemma-4-e2b

peft:
  enabled: true
  method: lora
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 20
  total_steps: 400

precision:
  dtype: bf16
  grad_dtype: fp32

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 100
  retain_last: 3
  retain_every: 400

tracking:
  wandb: false
  tensorboard: true
