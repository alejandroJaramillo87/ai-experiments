# distill-response-gemma-e2b.yaml
#
# Phase 1 recipe card (roadmap F8), distillation stage 1 of 2:
# response-level pass. Gemma 4 E2B student trains on teacher responses
# generated by google/gemma-4-E4B-it through the F4 harness
# (make generate-teacher), prepared into a masked SFT artifact by F1.
# Stage 2 is distill-logit-gemma-e2b.yaml, which continues from this
# stage's merged output. Run: make train-distill CONFIG=<this file> with
# no overrides. Weights are gated on the Hugging Face hub; HF_TOKEN comes
# from the untracked training env file (D6 convention).
#
# DRAFT (not yet validated). The F8 validation run back-fills:
#   Measured peak VRAM:   TBD
#   Wall-clock (9950X/5090): TBD
#   Teacher dataset manifest hash: TBD (recorded from the F4 run)
#   model.hf.revision:    pin the resolved hub commit at validation

run:
  name: distill-response-gemma-e2b
  seed: 42
  notes: "F8 distill card stage 1: E2B response-level pass on gemma-4-E4B-it outputs."

model:
  hf:
    id: google/gemma-4-E2B
    # revision: <pin at validation>

sft:
  enabled: true
  # F4 respond-pipeline output run through prepare_sft.py (F4 acceptance
  # guarantees the messages format converts unchanged).
  dataset: /mnt/ai-data/training/datasets/sft/teacher-e4b-responses
  backend: trl
  packing: true
  eval_steps: 100

distill:
  enabled: true
  tier: response
  # F4 manifest recording the teacher (google/gemma-4-E4B-it) that
  # generated sft.dataset; F7 cites its teacher block.
  teacher_manifest: /mnt/ai-data/training/datasets/distill/teacher-e4b-responses/manifest.json

data:
  # Unused by the trainer (sft.dataset supplies examples); batch geometry
  # below is what train-distill consumes.
  source: /mnt/ai-data/training/datasets/sft/teacher-e4b-responses
  seq_len: 4096
  micro_batch: 2
  grad_accum: 16
  workers: 4
  pin_memory: true

tokenizer:
  path: google/gemma-4-E2B

peft:
  enabled: true
  method: lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 100
  total_steps: 1000

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 500
  retain_last: 3
  retain_every: 2000
