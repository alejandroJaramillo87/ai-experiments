# distill-logit-qwen3.yaml
#
# Qwen3 fallback twin of distill-logit-gemma-e2b.yaml (model policy:
# Gemma 4 primary, Qwen3 fallback), distillation stage 2 of 2: online
# logit-KL pass. The student is stage 1's merged output (response-level
# pass exported through the F6 adapter-merge path); the frozen teacher is
# Qwen/Qwen3-4B, nf4-quantized so teacher and QLoRA student fit together
# in 32GB. Teacher and student tokenizers are identical, so the logit-tier
# identity preflight holds. Run: make train-distill CONFIG=<this file>
# with no overrides, after stage 1 and its export.
#
# DRAFT (not yet validated). A validation run back-fills:
#   Measured peak VRAM:   TBD (teacher nf4 + student QLoRA, the tight fit)
#   Wall-clock (9950X/5090): TBD
#   alpha / temperature:  recorded from validation (initial 0.5 / 2.0)

run:
  name: distill-logit-qwen3
  seed: 42
  notes: "Qwen3 fallback twin of distill-logit-gemma-e2b: online logit-KL, merged stage-1 student, Qwen3-4B teacher."

model:
  hf:
    # Stage 1's adapter merged into the base (training/export merge path);
    # the exact path comes from the stage-1 export run.
    id: /mnt/ai-data/training/exports/distill-response-qwen3/merged

sft:
  enabled: true
  # Same F1-prepared artifact as stage 1; the KL term supplies the
  # teacher signal, the dataset supplies prompts and masks.
  dataset: /mnt/ai-data/training/datasets/sft/teacher-qwen3-responses
  backend: trl        # tier=logit is trl-only (resolved F5 decision 2)
  packing: false      # keeps the card cached-mode compatible if VRAM forces a switch
  eval_steps: 100

distill:
  enabled: true
  tier: logit
  teacher: Qwen/Qwen3-4B
  teacher_quantize: nf4   # frozen nf4 teacher; exact bf16 also fits
  mode: online
  alpha: 0.5              # CE weight; 1 - alpha weights the KL
  temperature: 2.0
  kl_direction: forward

data:
  # Unused by the trainer (sft.dataset supplies examples); batch geometry
  # below is what train-distill consumes.
  source: /mnt/ai-data/training/datasets/sft/teacher-qwen3-responses
  seq_len: 4096
  micro_batch: 1
  grad_accum: 32
  workers: 4
  pin_memory: true

tokenizer:
  path: Qwen/Qwen3-1.7B

peft:
  enabled: true
  method: lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4      # QLoRA student
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.05

schedule:
  type: cosine
  warmup_steps: 50
  total_steps: 1000

precision:
  dtype: bf16
  grad_dtype: fp32

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 500
  retain_last: 3
  retain_every: 2000
