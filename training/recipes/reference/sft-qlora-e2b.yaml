# sft-qlora-e2b.yaml
#
# Phase 1 reference recipe (roadmap F2/F3): QLoRA fine-tune of Gemma 4 E2B
# (the Phase 1 primary family; HF model_type gemma4), the stand-in for the
# F8 SFT recipe until F8 lands. Exercises the peft group end to end (NF4
# base quantization, LoRA adapter, target_modules "auto" resolution) and
# the F3 trainer: make train-sft CONFIG=... over an F1-prepared ultrachat
# dataset (make prepare-sft ARGS="--source HuggingFaceH4/ultrachat_200k
# --split train_sft ..."). The F2 calculator acceptance measures this
# recipe's predicted peak VRAM against the workstation. Weights are gated
# on the Hugging Face hub; HF_TOKEN comes from the untracked training env
# file (D6 convention).

run:
  name: sft-qlora-e2b
  seed: 42
  notes: "F2 reference QLoRA recipe (Gemma 4 E2B); F8 SFT recipe stand-in."

model:
  hf:
    id: google/gemma-4-E2B
    revision: d29ff6b45f081a49ee2733a859c9c9c2d95d1a6f
  # No tokenizer block: a fine-tune reuses the tokenizer this directory ships,
  # and every reader resolves it from model.hf.id (schema.py TokenizerConfig).

sft:
  enabled: true
  # F1-prepared, hash-verified artifact (scripts/training/prepare_sft.py).
  dataset: /mnt/ai-data/training/datasets/sft/ultrachat-e2b
  backend: trl
  packing: true       # pack short chats into full seq_len sequences
  eval_steps: 100     # held-out loss cadence for the F7 curve

data:
  # Unused by the F3 trainer (sft.dataset supplies examples); batch geometry
  # below is what train-sft consumes. 2 x 2048 tokens per micro-batch: the
  # head materializes micro_batch x seq_len x 262144 logits and the loss
  # holds them in fp32 through backward, a term checkpointing does not
  # touch, and 4 x 2048 ran the RTX 5090 out of memory beside the NF4 base
  # (FT.calibrate-qlora's third attempt, KB-85). grad_accum keeps the
  # effective batch at 32 sequences.
  source: /mnt/ai-data/training/datasets/sft/ultrachat-e2b
  seq_len: 2048
  micro_batch: 2
  grad_accum: 16
  workers: 4
  pin_memory: true

peft:
  enabled: true
  method: lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 100
  total_steps: 2000

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 500
  retain_last: 3
  retain_every: 2000

tracking:
  wandb: false
  tensorboard: true
