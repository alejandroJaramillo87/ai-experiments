# distill-qwen3.yaml
#
# Qwen3 fallback twin of distill-e2b.yaml (model policy: Gemma 4 primary,
# Qwen3 fallback). Logit distillation of Qwen3 1.7B (QLoRA student) from a
# frozen Qwen3 4B teacher. Online mode with an nf4 teacher keeps both models
# resident in 32GB; switch to mode: cached (plus a 'make distill-cache'
# pre-pass and sft.packing stays false) to free the teacher's VRAM. Qwen3
# 4B and 1.7B share a tokenizer, satisfying the identity preflight; the
# scorecard criterion compares the student against its pre-distillation
# self via F7's --baseline.

run:
  name: distill-qwen3
  seed: 42
  notes: "Qwen3 fallback twin of distill-e2b: Qwen3-1.7B student distilled from Qwen3-4B, logit tier"

model:
  hf:
    id: Qwen/Qwen3-1.7B

sft:
  enabled: true
  # F1-prepared, hash-verified artifact tokenized with the Qwen3 tokenizer.
  dataset: /mnt/ai-data/training/datasets/sft/ultrachat-qwen3
  backend: trl        # tier=logit is trl-only (resolved F5 decision 2)
  packing: false      # required by mode: cached; optional for online
  eval_steps: 100     # held-out CE cadence (comparable with F3 runs)

distill:
  enabled: true
  tier: logit
  teacher: Qwen/Qwen3-4B
  teacher_quantize: nf4   # frozen nf4 teacher; exact bf16 also fits
  mode: online
  alpha: 0.5              # CE weight; 1 - alpha weights the KL
  temperature: 2.0
  kl_direction: forward

data:
  # Unused by the F5 trainer (sft.dataset supplies examples); batch geometry
  # below is what train-distill consumes.
  source: /mnt/ai-data/training/datasets/sft/ultrachat-qwen3
  seq_len: 2048
  micro_batch: 2
  grad_accum: 16
  workers: 4
  pin_memory: true

tokenizer:
  path: Qwen/Qwen3-1.7B

optimizer:
  name: adamw8bit
  lr: 1.0e-4
  weight_decay: 0.05

schedule:
  type: cosine
  warmup_steps: 50
  total_steps: 1000

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true

peft:
  enabled: true
  method: lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4      # QLoRA student
  compute_dtype: bf16

checkpoint:
  interval_steps: 200
  retain_last: 3
  retain_every: 1000
