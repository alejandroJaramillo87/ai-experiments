# pretrain-1b.yaml
#
# Phase 0 reference recipe (roadmap D5): ~1B-parameter scratch pretrain, the
# envelope config that must fit in 32GB VRAM (validated by the D4 calculator).
# Architecture follows the Llama-3.2-1B shape (GQA 32/8, tied embeddings).

run:
  name: pretrain-1b
  seed: 42
  notes: "32GB VRAM envelope config; gradient checkpointing on."

model:
  scratch:
    layers: 16
    hidden: 2048
    heads: 32
    kv_heads: 8
    ffn_mult: 4.0
    vocab: 49152
    rope_theta: 500000.0
    tie_embeddings: true

data:
  source: /mnt/ai-data/training/shards/fineweb-edu-10B
  seq_len: 2048
  micro_batch: 4
  grad_accum: 16
  workers: 4
  pin_memory: true

tokenizer:
  path: /mnt/ai-data/training/tokenizers/smollm2

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

schedule:
  type: cosine
  warmup_steps: 2000
  total_steps: 200000

precision:
  dtype: bf16
  grad_dtype: fp32

memory:
  gradient_checkpointing: true
  offload: none
  compile: true

checkpoint:
  interval_steps: 1000
  retain_last: 3
  retain_every: 10000

tracking:
  wandb: false
  tensorboard: true
