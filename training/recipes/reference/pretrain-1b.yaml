# pretrain-1b.yaml
#
# Phase 0 reference recipe (roadmap D5): ~1B-parameter scratch pretrain, the
# envelope config that must fit in 32GB VRAM (validated by the D4 calculator).
# The shape is the Gemma 4 block at reduced scale (docs/training/base/training-scale-reference.md
# phase 4): E2B's hidden width, 8:1 head-to-KV-head ratio, 4x feed-forward
# multiplier, global RoPE base and 262144-entry vocabulary, at 18 of its 35
# layers. The scratch builder still emits a Llama block (training/models/
# model.py) until phase 4 adds the Gemma block; the dimensions carry over.

run:
  name: pretrain-1b
  seed: 42
  notes: "32GB VRAM envelope config; gradient checkpointing on."

model:
  scratch:
    layers: 18
    hidden: 1536
    heads: 8
    kv_heads: 1
    ffn_mult: 4.0
    vocab: 262144
    rope_theta: 1000000.0
    tie_embeddings: true

data:
  source: /mnt/ai-data/training/shards/fineweb-edu-10B
  seq_len: 2048
  micro_batch: 4
  grad_accum: 16
  workers: 4
  pin_memory: true

tokenizer:
  path: /mnt/ai-data/training/tokenizers/gemma-4-e2b

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

schedule:
  type: cosine
  warmup_steps: 2000
  total_steps: 200000

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true
  offload: none
  compile: true

checkpoint:
  interval_steps: 1000
  retain_last: 3
  retain_every: 10000

tracking:
  wandb: false
  tensorboard: true
