# sft-qlora-gemma-e4b.yaml
#
# The Gemma 4 E4B SFT reference: QLoRA fine-tune on a pinned
# ultrachat-derived instruction dataset, sequence length 4096 with packing,
# cosine schedule, tracking and watchdog defaults. E2B and E4B are the two
# subjects this repository trains; sft-qlora-e2b.yaml is the cheap smoke
# recipe and the one the fine-tuning runbook verifies first. Run: make train-sft CONFIG=<this file> with no
# overrides. Weights are gated on the Hugging Face hub; HF_TOKEN comes from
# the untracked training env file (D6 convention).
#
# Not yet run on the workstation. The fine-tuning runbook's E4B entries
# back-fill the fields below.
#   Measured peak VRAM:   TBD (D4 memfit prediction must be within 10%)
#   Wall-clock (9950X/5090): TBD
#   model.hf.revision:    pinned (schemas/gemma4_facts.json, E4B)
#
# Preflight note (July 2026): verify the pinned transformers release fixes
# the reported Gemma 4 E-model KV-sharing bug under use_cache=False
# (gradient checkpointing forces it); see
# docs/training/f8_recipe_cards_investigation.md.

run:
  name: sft-qlora-gemma-e4b
  seed: 42
  notes: "F8 SFT recipe card: QLoRA fine-tune of Gemma 4 E4B on pinned ultrachat."

model:
  hf:
    id: google/gemma-4-E4B
    revision: 411aa17b749aa952df1359d2dcea73917a544d9a

sft:
  enabled: true
  # F1-prepared, hash-verified artifact: make prepare-sft ARGS="--source
  # HuggingFaceH4/ultrachat_200k --split train_sft --revision <pinned>
  # --tokenizer google/gemma-4-E4B --model-type gemma4 --max-seq-len 4096
  # --out /mnt/ai-data/training/datasets/sft/ultrachat-gemma-e4b"
  dataset: /mnt/ai-data/training/datasets/sft/ultrachat-gemma-e4b
  backend: trl
  packing: true       # pack short chats into full seq_len sequences
  eval_steps: 100     # held-out loss cadence for the F7 curve

data:
  # Unused by the F3 trainer (sft.dataset supplies examples); batch geometry
  # below is what train-sft consumes.
  source: /mnt/ai-data/training/datasets/sft/ultrachat-gemma-e4b
  seq_len: 4096
  micro_batch: 2
  grad_accum: 16
  workers: 4
  pin_memory: true

tokenizer:
  path: google/gemma-4-E4B

peft:
  enabled: true
  method: lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto   # resolved per family; snapshot carries the list
  quantize_base: nf4
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 100
  total_steps: 1500

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 500
  retain_last: 3
  retain_every: 2000
