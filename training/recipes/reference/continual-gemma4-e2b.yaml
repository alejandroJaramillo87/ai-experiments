# continual-gemma4-e2b.yaml
#
# Phase 2 P2-D5 calibration recipe: full-parameter continual pre-training of
# the Gemma-4-E2B transformer stack under ZeRO-Offload — bf16 weights and
# gradients on the 32GB GPU, fp32 master weights and Adam moments in system
# RAM, the optimizer step on the 9950X (CPUAdam). Embeddings, the tied LM
# head, and the per-layer embedding tables are frozen (trainable_filter:
# transformer_stack); the D4 calibration harness runs against this recipe
# and its host-RAM/VRAM predictions must land within 10 percent of measured.
# Weights are gated on the Hugging Face hub; HF_TOKEN comes from the
# untracked training env file (D6 convention).
#
# DRAFT (not yet validated). The P2-D5 calibration run back-fills:
#   Pinned model revision:   set (schemas/gemma4_facts.json, E2B)
#   Measured peak VRAM:      TBD
#   Measured peak host RAM:  TBD
#   tokens/s at seq 4096:    TBD (with GPU-compute vs optimizer-wait breakdown)
#   Bucket sizes:            2e8 initial; tuned during calibration

run:
  name: continual-gemma4-e2b
  seed: 42
  notes: "P2-D5 calibration: ZeRO-Offload full-parameter continual pretrain, frozen embeddings/PLE."

model:
  hf:
    id: google/gemma-4-E2B
    # The commit schemas/gemma4_facts.json records for E2B (operating rule:
    # pin, then fix, then update).
    revision: d29ff6b45f081a49ee2733a859c9c9c2d95d1a6f
  trainable_filter: transformer_stack

mixture:
  enabled: true
  sources:
    - name: domain
      # P2-D1 prepared uint32 shards of the reference-run domain corpus
      # (chosen at P2-D7 implementation time; pes2o-class technical text).
      path: /mnt/ai-data/training/shards/domain-corpus
      weight: 1.0

replay:
  enabled: true
  fraction: 0.2
  sources:
    - name: replay-web
      path: /mnt/ai-data/training/shards/fineweb-edu-replay
      weight: 0.7
    - name: replay-code
      path: /mnt/ai-data/training/shards/code-replay
      weight: 0.3
  max_gb: 16.0

data:
  seq_len: 4096
  micro_batch: 1
  grad_accum: 32
  workers: 4
  pin_memory: true

optimizer:
  name: cpu_adam
  lr: 5.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

schedule:
  type: wsd
  warmup_steps: 100
  total_steps: 2000        # calibration envelope; P2-D7 scales this up
  decay_start_frac: 0.9
  final_lr_frac: 0.1
  decay_shape: 1-sqrt

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true
  offload: zero_offload
  compile: false
  allgather_bucket_size: 2.0e8
  reduce_bucket_size: 2.0e8
  offload_pin_memory: true

checkpoint:
  interval_steps: 500
  retain_last: 3
  retain_every: 1000

watchdog:
  enabled: true
  ram_floor_gb: 8.0        # offload run: the RAM floor is the active guard

tracking:
  wandb: false
  tensorboard: true
