# pretrain-150m.yaml
#
# Phase 0 reference recipe (roadmap D5): ~135M-parameter scratch pretrain used for
# D4 calculator calibration and envelope validation. The shape is the Gemma 4
# block at reduced scale, as docs/training/base/training-scale-reference.md phase 4
# specifies: E2B's 8:1 head-to-KV-head ratio, its 4x feed-forward multiplier,
# its global RoPE base, and the Gemma tokenizer's 262144-entry vocabulary (the
# tied table is most of the parameter count). The scratch builder still emits a
# Llama block (training/models/model.py); phase 4 adds the Gemma block, and
# this recipe's dimensions carry over unchanged when it does.

run:
  name: pretrain-150m
  seed: 42
  notes: "Reference config for calculator calibration; not a production run."

model:
  scratch:
    layers: 16
    hidden: 384
    heads: 8
    kv_heads: 1
    ffn_mult: 4.0
    vocab: 262144
    rope_theta: 1000000.0
    tie_embeddings: true

data:
  source: /mnt/ai-data/training/shards/fineweb-edu-10B
  seq_len: 2048
  # 4 x 16 = 64 sequences per step; the 262144-row logits tensor at seq_len
  # 2048 is the peak, and micro_batch 16 puts it past 32GB.
  micro_batch: 4
  grad_accum: 16
  workers: 4
  pin_memory: true
  prefetch_factor: 2

# D9 heterogeneous-compute knobs, explicit so the reference acceptance run is
# reproducible from the recipe alone. Both off: NVMe + page cache is already
# RAM-speed, and affinity stays parked unless it measurably helps.
staging:
  enabled: false
  dir: /staging
  max_gb: 32.0

affinity:
  enabled: false
  main: "0-7"
  workers: "8-15"
  include_smt: true

tokenizer:
  path: /mnt/ai-data/training/tokenizers/gemma-4-e2b

optimizer:
  name: adamw
  lr: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

schedule:
  type: cosine
  warmup_steps: 2000
  total_steps: 100000

precision:
  dtype: bf16

memory:
  gradient_checkpointing: false
  offload: none
  compile: true

checkpoint:
  interval_steps: 2000
  retain_last: 3
  retain_every: 20000

tracking:
  wandb: false
  tensorboard: true
