# distill-response-qwen3.yaml
#
# Qwen3 fallback twin of distill-response-gemma-e2b.yaml (model policy:
# Gemma 4 primary, Qwen3 fallback), distillation stage 1 of 2:
# response-level pass. Qwen3 1.7B student trains on teacher responses
# generated by Qwen/Qwen3-4B through the F4 harness (make generate-teacher),
# prepared into a masked SFT artifact by F1. Stage 2 is
# distill-logit-qwen3.yaml, which continues from this stage's merged
# output. Run: make train-distill CONFIG=<this file> with no overrides.
#
# DRAFT (not yet validated). A validation run back-fills:
#   Measured peak VRAM:   TBD
#   Wall-clock (9950X/5090): TBD
#   Teacher dataset manifest hash: TBD (recorded from the F4 run)
#   model.hf.revision:    pin the resolved hub commit at validation

run:
  name: distill-response-qwen3
  seed: 42
  notes: "Qwen3 fallback twin of distill-response-gemma-e2b: 1.7B response-level pass on Qwen3-4B outputs."

model:
  hf:
    id: Qwen/Qwen3-1.7B
    # revision: <pin at validation>

sft:
  enabled: true
  # F4 respond-pipeline output run through prepare_sft.py (F4 acceptance
  # guarantees the messages format converts unchanged).
  dataset: /mnt/ai-data/training/datasets/sft/teacher-qwen3-responses
  backend: trl
  packing: true
  eval_steps: 100

distill:
  enabled: true
  tier: response
  # F4 manifest recording the teacher (Qwen/Qwen3-4B) that generated
  # sft.dataset; F7 cites its teacher block.
  teacher_manifest: /mnt/ai-data/training/datasets/distill/teacher-qwen3-responses/manifest.json

data:
  # Unused by the trainer (sft.dataset supplies examples); batch geometry
  # below is what train-distill consumes.
  source: /mnt/ai-data/training/datasets/sft/teacher-qwen3-responses
  seq_len: 4096
  micro_batch: 2
  grad_accum: 16
  workers: 4
  pin_memory: true

tokenizer:
  path: Qwen/Qwen3-1.7B

peft:
  enabled: true
  method: lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 100
  total_steps: 1000

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 500
  retain_last: 3
  retain_every: 2000
