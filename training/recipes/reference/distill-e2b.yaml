# distill-e2b.yaml
#
# Phase 1 reference recipe (roadmap F5): logit distillation of Gemma 4 E2B
# (QLoRA student) from a frozen Gemma 4 E4B teacher, the stand-in for the
# F8 distill recipe until F8 lands. Online mode with an nf4 teacher keeps
# both models resident in 32GB; switch to mode: cached (plus a
# 'make distill-cache' pre-pass and sft.packing stays false) to free the
# teacher's VRAM. E4B and E2B share a tokenizer, satisfying the identity
# preflight; the scorecard criterion compares the student against its
# pre-distillation self via F7's --baseline (deferred until F7 lands).
# Weights are gated on the Hugging Face hub; HF_TOKEN comes from the
# untracked training env file (D6 convention).

run:
  name: distill-e2b
  seed: 42
  notes: "F5 reference: gemma-4-E2B student distilled from gemma-4-E4B, logit tier"

model:
  hf:
    id: google/gemma-4-E2B
    revision: d29ff6b45f081a49ee2733a859c9c9c2d95d1a6f

sft:
  enabled: true
  # F1-prepared, hash-verified artifact; an F4 respond-pipeline output run
  # through prepare_sft.py works unchanged (F4 acceptance guarantees it).
  dataset: /mnt/ai-data/training/datasets/sft/ultrachat-e2b
  backend: trl        # tier=logit is trl-only (resolved F5 decision 2)
  packing: false      # required by mode: cached; optional for online
  eval_steps: 100     # held-out CE cadence (comparable with F3 runs)

distill:
  enabled: true
  tier: logit
  teacher: google/gemma-4-E4B
  teacher_quantize: nf4   # frozen nf4 teacher; exact bf16 also fits
  mode: online
  alpha: 0.5              # CE weight; 1 - alpha weights the KL
  temperature: 2.0
  kl_direction: forward

data:
  # Unused by the F5 trainer (sft.dataset supplies examples); batch geometry
  # below is what train-distill consumes.
  source: /mnt/ai-data/training/datasets/sft/ultrachat-e2b
  seq_len: 2048
  micro_batch: 2
  grad_accum: 16
  workers: 4
  pin_memory: true

tokenizer:
  path: google/gemma-4-E2B

optimizer:
  name: adamw8bit
  lr: 1.0e-4
  weight_decay: 0.05

schedule:
  type: cosine
  warmup_steps: 50
  total_steps: 1000

precision:
  dtype: bf16

memory:
  gradient_checkpointing: true

peft:
  enabled: true
  method: lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4      # QLoRA student
  compute_dtype: bf16

checkpoint:
  interval_steps: 200
  retain_last: 3
  retain_every: 1000
