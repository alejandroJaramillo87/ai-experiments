# sft-qlora-1b.yaml
#
# Phase 1 reference recipe (roadmap F2): QLoRA fine-tune of a 1B-class HF
# base model, the stand-in for the F8 SFT recipe until F8 lands. Exercises
# the peft group end to end: NF4 base quantization, LoRA adapter, and
# target_modules "auto" resolution. The F2 calculator acceptance measures
# this recipe's predicted peak VRAM against the workstation.

run:
  name: sft-qlora-1b
  seed: 42
  notes: "F2 reference QLoRA recipe; F8 SFT recipe stand-in."

model:
  hf:
    id: meta-llama/Llama-3.2-1B

data:
  source: /mnt/ai-data/training/datasets/sft-placeholder
  seq_len: 2048
  micro_batch: 4
  grad_accum: 8
  workers: 4
  pin_memory: true

tokenizer:
  path: /mnt/ai-data/training/tokenizers/llama-3.2

peft:
  enabled: true
  method: lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
  quantize_base: nf4
  double_quant: true
  compute_dtype: bf16

optimizer:
  name: adamw8bit
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 100
  total_steps: 2000

precision:
  dtype: bf16
  grad_dtype: fp32

memory:
  gradient_checkpointing: true
  offload: none
  compile: false

checkpoint:
  interval_steps: 500
  retain_last: 3
  retain_every: 2000

tracking:
  wandb: false
  tensorboard: true
