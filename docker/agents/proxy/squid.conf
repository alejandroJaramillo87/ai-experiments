# squid.conf — egress allowlist for the agent sandbox.
#
# Deny-by-default forward proxy. Only the domains an agent legitimately needs
# are reachable: the LLM API it drives, the RunPod control plane, the code host,
# and the package registries. The list grows deliberately — add a domain only
# with a recorded reason (see docs/sandbox/agent-sandbox.md).
#
# HTTPS is allowlisted by CONNECT host without TLS interception, so no private
# CA is installed and no traffic is decrypted.

# Only the agent-internal subnet may use the proxy.
acl localnet src 172.31.0.0/16

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Egress allowlist. dstdomain matches the Host header (plain HTTP) and the
# CONNECT target host (HTTPS), so both are covered without MITM. A leading dot
# matches the apex domain and all subdomains, so only the dotted form is listed
# (squid rejects an entry that is already a subdomain of another).
acl allowed_domains dstdomain .anthropic.com
# Claude Code subscription (OAuth) auth: token exchange and API calls go to
# platform.claude.com / claude.ai, not api.anthropic.com.
acl allowed_domains dstdomain .claude.com
acl allowed_domains dstdomain .claude.ai
acl allowed_domains dstdomain .runpod.io
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain .pypi.org
acl allowed_domains dstdomain .pythonhosted.org
# Model specifications: config.json, tokenizer files, and safetensors headers.
# A session that cannot read these guesses at model internals instead
# (see docs/models/gemma-4.md). Large-file reads may redirect to Xet storage
# under a separate domain; add it only if a fetch is observed to require it.
acl allowed_domains dstdomain .huggingface.co
# huggingface.co 302s file reads to Xet-backed CDN storage on a separate
# domain, so reading a safetensors header by range request needs this too.
# Verified: without it the redirect hop returns squid ERR_ACCESS_DENIED while
# the first hop succeeds, which reads as a Hugging Face failure rather than a
# proxy refusal.
acl allowed_domains dstdomain .cdn.hf.co
# Rust dependency metadata for the rust-harness workspace. The dotted form
# covers static.crates.io, which squid refuses to list separately.
acl allowed_domains dstdomain .crates.io
# Rust toolchain distribution. The image bakes the pinned toolchain, so this is
# not needed for a normal build; it exists so that bumping the channel in
# rust-harness/rust-toolchain.toml works without an image rebuild, instead of
# failing as an opaque transport error inside rustup.
acl allowed_domains dstdomain .rust-lang.org
# Gemma and other Google model documentation. Exact host, not the dotted form:
# .google.dev would open every subdomain for one documentation site.
acl allowed_domains dstdomain ai.google.dev
# Documentation for the pinned stack. Already trusted by both tool configs
# (.claude/settings.json, opencode.json); listing them here is what makes the
# tool policy and the egress allowlist agree instead of failing as a transport
# error. Read-only documentation sites.
acl allowed_domains dstdomain .vllm.ai
acl allowed_domains dstdomain .nvidia.com
acl allowed_domains dstdomain .docker.com

# Refuse CONNECT to anything but 443, and any request to a non-Safe port.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Core rule: allowed domains from the sandbox subnet only; everything else denied.
http_access allow localnet allowed_domains
http_access deny all

http_port 3128

# No caching (an agent's fetches are not cache-friendly and a cache is state).
cache deny all

# Minimal, privacy-preserving forwarding headers.
forwarded_for delete
via off

# Audit log of every reached domain. Written to a tmpfs dir (see the compose
# file) so the read-only rootfs is preserved; inspect with
# `docker exec agent-proxy cat /var/log/squid/access.log`.
logfile_rotate 0
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
