# squid.conf — egress allowlist for the agent sandbox.
#
# Deny-by-default forward proxy. Only the domains an agent legitimately needs
# are reachable: the LLM API it drives, the RunPod control plane, the code host,
# and the package registries. The list grows deliberately — add a domain only
# with a recorded reason (see docs/sandbox/agent-sandbox.md).
#
# HTTPS is allowlisted by CONNECT host without TLS interception, so no private
# CA is installed and no traffic is decrypted.

# Only the agent-internal subnet may use the proxy.
acl localnet src 172.31.0.0/16

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Egress allowlist. dstdomain matches the Host header (plain HTTP) and the
# CONNECT target host (HTTPS), so both are covered without MITM. A leading dot
# matches the apex domain and all subdomains, so only the dotted form is listed
# (squid rejects an entry that is already a subdomain of another).
acl allowed_domains dstdomain .anthropic.com
acl allowed_domains dstdomain .runpod.io
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain .pypi.org
acl allowed_domains dstdomain .pythonhosted.org

# Refuse CONNECT to anything but 443, and any request to a non-Safe port.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Core rule: allowed domains from the sandbox subnet only; everything else denied.
http_access allow localnet allowed_domains
http_access deny all

http_port 3128

# No caching (an agent's fetches are not cache-friendly and a cache is state).
cache deny all

# Minimal, privacy-preserving forwarding headers.
forwarded_for delete
via off

# Audit log of every reached domain. Written to a tmpfs dir (see the compose
# file) so the read-only rootfs is preserved; inspect with
# `docker exec agent-proxy cat /var/log/squid/access.log`.
logfile_rotate 0
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
