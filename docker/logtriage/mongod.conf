# mongod configuration for the log triage stack.
#
# Adapted from the MongoDB Database Manual's own sample for a containerised
# MongoDB Search deployment (includes/search-in-community/sample-mongod-conf-docker.rst,
# corpus commit 88ec8192b924). The addresses are the compose service names
# because the two processes are in different network namespaces; localhost in
# either file would resolve to the wrong container.
#
# Mounted read-only at /etc/mongod.conf. Changing a value here is a restart of
# logtriage-mongo, not a reconfiguration of a running server.

net:
  port: 27017
  # The container is on a private compose network and publishes only to
  # 127.0.0.1 on the host, so binding all interfaces inside it exposes nothing
  # further. mongot connects over that network and would be refused otherwise.
  bindIpAll: true

replication:
  # MongoDB Search reads the collection through a change stream, and change
  # streams require a replica set. A single-node set is still a replica set;
  # scripts/logtriage/bootstrap.sh initiates it once.
  replSetName: rs0

setParameter:
  # Where mongod sends search index management commands, and where it sends
  # $search and $vectorSearch. The manual requires the two to be equal.
  searchIndexManagementHostAndPort: logtriage-mongot:27028
  mongotHost: logtriage-mongot:27028
  # Authenticate to mongot rather than trusting the network. The manual sets
  # this false for Community as of 8.2.2; false means "do not skip".
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true

security:
  authorization: enabled
  # Shared secret proving mongod and mongot belong to the same deployment.
  # Generated by `make logtriage-secrets`, never committed.
  keyFile: /keyfile
