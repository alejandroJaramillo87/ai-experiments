# mongot configuration for the log triage stack.
#
# Adapted from the MongoDB Database Manual's own sample
# (includes/search-in-community/sample-mongot-conf-docker.rst, corpus commit
# 88ec8192b924). Mounted read-only at /mongot-community/config.default.yml,
# which is where the image looks for it.
#
# The username here must exist on the deployment with the searchCoordinator
# role, and the password file must hold exactly what that user was created
# with. scripts/logtriage/bootstrap.sh creates the user from the same file, so
# the two cannot disagree.

syncSource:
  replicaSet:
    hostAndPort: "logtriage-mongo:27017"
    username: "mongotUser"
    passwordFile: "/passwordFile"
    authSource: "admin"
    # Both containers are on a private compose network that publishes nothing
    # but loopback. TLS between them would need a CA and a rotation story for
    # no threat this deployment faces.
    tls: false
  replicationReader:
    # The set has one member, so this always resolves to the primary. Left at
    # the manual's value so a second member later needs no change here.
    readPreference: "secondaryPreferred"

storage:
  dataPath: "/data/mongot"

server:
  grpc:
    # Bound to the container's own address on the compose network, not 0.0.0.0.
    # The manual warns that a query server reachable from public networks risks
    # unauthorized access, and mongod is the only client that needs it.
    address: "logtriage-mongot:27028"
    tls:
      mode: "disabled"

metrics:
  enabled: true
  address: "logtriage-mongot:9946"

healthCheck:
  address: "logtriage-mongot:8080"

logging:
  verbosity: INFO
