[workspace]
members = ["harness", "runtime"]
resolver = "2"

# Release optimization with debug info retained: required by cargo flamegraph
# for readable stacks and by the phase 3 rr workflow for source-level replay.
[profile.release-with-debug]
inherits = "release"
debug = true

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
# flock only: the obs run-log holds a shared lock so the Python retention
# pruner treats the live event file as in use (common/obs/retention.py)
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tracing-chrome = "0.7"
