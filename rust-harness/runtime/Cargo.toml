[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real Candle/CUDA backend for the RTX 5090; the default build is CPU-free and
# GPU-free so the workspace compiles and tests in a sandbox.
cuda = []

[dependencies]
anyhow = { workspace = true }
# Run-level observability records. The edge points this way and never back:
# obs reaches only std, libc and serde_json, so a crate that forbids unsafe
# can depend on it -- which is the property the U9a extraction bought, and
# `ladder` is the first binary to spend it.
obs = { path = "../obs" }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
