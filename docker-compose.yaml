version: '3.9'

services:
  llama-cpu:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    deploy:
      resources:
        limits:
          memory: 96G
    ulimits:
      memlock:
        soft: -1
        hard: -1
    build:
      context: .
      dockerfile: docker/llama-cpu/Dockerfile.cpu
    container_name: llama-cpu
    restart: unless-stopped
    cpuset: "0-15"
    environment:
      - SERVER_PORT=8001
      - MODEL_PATH=${LLAMA_MODEL:-${LLAMA_ZEN5_MODEL}}
      - THREADS=16
      - THREADS_BATCH=16
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    volumes:
      - /mnt/ai-data/models/:/app/models:ro
      - ./logs/cpu:/app/logs
      - ./datasets:/app/datasets
      - /sys:/sys:ro
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  llama-gpu:
    init: true  # Use tini as PID 1 for proper signal forwarding (required for nsys)
    user: "${UID:-1000}:${GID:-1000}"  # Match host user for volume write access (nsys)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      memlock:
        soft: -1
        hard: -1
    build:
      context: .
      dockerfile: docker/llama-gpu/Dockerfile.llama-gpu
    container_name: llama-gpu
    restart: unless-stopped
    # runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - SERVER_PORT=8002
      - MODEL_PATH=${LLAMA_GPU_MODEL}
      # Nsight Systems profiling (set NSYS_PROFILE=true to enable)
      - NSYS_PROFILE=${NSYS_PROFILE:-false}
      - NSYS_OUTPUT=${NSYS_OUTPUT:-/app/nsys_output/profile}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      # GPU API port binding
      - "127.0.0.1:8002:8002"
    read_only: true
    tmpfs:
      - /tmp:size=4G,mode=1777  # CUDA cache and temp files
    volumes:
      # Model storage mount
      - /mnt/ai-data/models/:/app/models:ro
      # Log storage
      - ./logs/gpu:/app/logs
      # Nsys profiling output (only used when NSYS_PROFILE=true)
      - ./gpu_benchmark_results:/app/nsys_output
    networks:
      - ai-network
    healthcheck:
      # Service health monitoring
      test: ["CMD", "curl", "-f", "http://localhost:8002/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s # Give the GPU model time to load into VRAM 

  # vLLM GPU Service - Optimized for RTX 5090
  vllm-gpu:
    init: true  # Use tini as PID 1 for proper signal forwarding (required for nsys)
    # user: "${UID:-1000}:${GID:-1000}"  # Match host user for volume write access (nsys)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      memlock:
        soft: -1
        hard: -1
    build:
      context: .
      dockerfile: docker/vllm-gpu/Dockerfile.vllm-gpu
    container_name: vllm-gpu
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_PATH=${VLLM_GPU_MODEL}
      # Nsight Systems profiling (set NSYS_PROFILE=true to enable)
      - NSYS_PROFILE=${NSYS_PROFILE:-false}
      - NSYS_OUTPUT=${NSYS_OUTPUT:-/app/nsys_output/profile}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      # vLLM API port binding
      - "127.0.0.1:8003:8003"
    read_only: true
    tmpfs:
      - /tmp:size=4G,mode=1777  # For CUDA cache and temp files
      - /app/.cache:size=1G,mode=1777  # vLLM model info cache
      - /app/cache:size=2G,mode=1777   # HuggingFace cache (HF_HOME)
      - /app/.config:size=100M,mode=1777  # vLLM usage stats
      - /app/.triton:size=2G,mode=1777,exec  # Triton compilation cache
    volumes:
      # Model storage mount
      - /mnt/ai-data/models/:/app/models:ro
      # Log storage
      - ./logs/vllm:/app/logs
      # Nsys profiling output (only used when NSYS_PROFILE=true)
      - ./gpu_benchmark_results:/app/nsys_output
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s # vLLM needs time to load the model

  
  # Open WebUI Service
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080" # Access WebUI from http://localhost:3000
    read_only: true
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - ai-network
    # Backend service configuration
    environment:
      # API endpoint configuration
      - 'OPENAI_API_BASE_URL=http://llama-gpu:8002/v1'
      # Internal API access
      - 'OPENAI_API_KEY=NONE'
      # Model configuration import
      - 'WEBUI_IMPORTS=[{"name":"qwen3 coder","model":"qwen3 coder","baseURL":"http://llama-gpu:8002/v1","apiKey":"NONE"}]'
      - 'WEBUI_SECRET_KEY=NONE'
    # depends_on:
    #   llama-gpu:
    #     condition: service_healthy # Wait for the GPU service to be healthy before starting

  # ComfyUI with FLUX.1-dev for image generation
  comfyui-flux:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      memlock:
        soft: -1
        hard: -1
    build:
      context: .
      dockerfile: docker/comfyui-flux/Dockerfile.comfyui-flux
    container_name: comfyui-flux
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - COMFYUI_PORT=8188
      - MODEL_BASE_PATH=/app/models
      - OUTPUT_PATH=/app/output
      - VRAM_MODE=${FLUX_VRAM_MODE:-highvram}
    deploy:
      resources:
        limits:
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      # ComfyUI web interface
      - "127.0.0.1:8188:8188"
    # read_only disabled as ComfyUI needs write access for manager and settings
    # Security maintained through: non-root user, resource limits, network isolation
    tmpfs:
      - /tmp:size=4G,mode=1777
      - /app/temp:size=2G,mode=1777
      - /app/input:size=1G,mode=1777
      - /app/.cache:size=1G,mode=1777
      - /app/user:size=100M,mode=1777
    volumes:
      # Model storage mount
      - /mnt/ai-data/models:/app/models:ro
      # Output directory for generated images
      - ./outputs/comfyui:/app/output
      # Log storage
      - ./logs/comfyui:/app/logs
      # ComfyUI workflows
      - ./workflows:/app/user/default/workflows
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

# Persistent storage
volumes:
  open-webui-data:

# Service network
networks:
  ai-network:
    driver: bridge
    internal: false # Set to false to allow pulling images, can be true in production
    ipam:
      config:
        - subnet: 172.20.0.0/16


