# pyproject.toml
# Managed with uv. Phase A pins are exact and match the last poetry.lock resolution;
# bump one group at a time per the pin-then-fix-then-update rule (AGENTS.md).

[project]
name = "ai-toolkit"
version = "0.1.0"
description = "Base Python project for AI engineering on RTX 5090"
authors = [{ name = "Alejandro", email = "alejandroj1234@proton.me" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Core AI/ML frameworks (torch trio resolved from the cu130 index, see [tool.uv])
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "transformers==4.51.3",
    "datasets==3.6.0",
    "accelerate==1.10.1",
    "peft==0.15.2",
    "evaluate==0.4.6",
    "deepspeed==0.17.6",
    "bitsandbytes==0.46.1",
    "sentencepiece==0.2.1",
    "einops==0.8.1",
    "sentence-transformers==5.1.0",

    # Model management
    "huggingface-hub==0.32.6",
    "hf-transfer==0.1.8",

    # Data science and visualization
    "jupyterlab==4.4.7",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "scikit-learn==1.7.2",
    "pandas==2.3.2",

    # Experiment tracking and MLOps
    "wandb==0.20.1",
    "mlflow==3.4.0",
    "tensorboard==2.20.0",

    # General utilities and optimization
    "tqdm==4.67.1",
    "rich==14.1.0",
    "ray[default]==2.49.2",
    "optuna==4.5.0",
    "tiktoken==0.9.0",
    "requests==2.32.5",
    "llama-cpp-python==0.3.16",

    # API development
    "fastapi==0.115.14",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
# Quantization tail, isolated so its heavy transitive pins (nemo-toolkit)
# cannot block resolution or upgrades of the core environment
quant = [
    "nemo-toolkit==2.1.0",
    "rouge-score==0.1.2",
    "transformers-stream-generator==0.0.5",
    "mpmath==1.3.0",
    "sseclient==0.0.27",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
    "pytest-cov==6.2.1",
    "ruff==0.13.1",
    "mypy==1.18.2",
]

[tool.uv]
package = false

# PyTorch CUDA 13.0 wheels; explicit = only packages pinned via [tool.uv.sources]
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

# deepspeed ships an sdist whose setup.py imports torch
[tool.uv.extra-build-dependencies]
deepspeed = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Vendored from llama.cpp; keep upstream style to ease future diffs
exclude = ["scripts/benchmark/server-bench.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "W293",  # blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]
