# pyproject.toml
# Managed with uv. Phase A pins are exact and match the last poetry.lock resolution;
# bump one group at a time per the pin-then-fix-then-update rule (AGENTS.md).

[project]
name = "ai-toolkit"
version = "0.1.0"
description = "Base Python project for AI engineering on RTX 5090"
authors = [{ name = "Alejandro", email = "alejandroj1234@proton.me" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Core AI/ML frameworks (torch/torchvision resolved from the cu130 index, see [tool.uv])
    # torchaudio dropped: unused in the codebase and no release past 2.11 (torch is 2.13).
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.13.1",
    "datasets==5.0.0",
    "accelerate==1.14.0",
    "peft==0.19.1",
    "evaluate==0.4.6",
    "deepspeed==0.19.2",
    "bitsandbytes==0.49.2",
    "sentencepiece==0.2.2",
    "einops==0.8.2",
    "sentence-transformers==5.6.0",

    # Model management
    "huggingface-hub==1.23.0",
    "hf-transfer==0.1.9",

    # Data science and visualization
    "jupyterlab==4.6.1",
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
    "scikit-learn==1.9.0",
    "pandas==2.3.3",  # held at 2.x: mlflow (all releases through 3.14) requires pandas<3

    # Experiment tracking and MLOps
    "wandb==0.28.0",
    "mlflow==3.14.0",  # still requires pandas<3; keeps pandas held at 2.x
    "tensorboard==2.21.0",

    # General utilities and optimization
    "tqdm==4.68.4",
    "rich==15.0.0",
    "ray[default]==2.56.0",
    "optuna==4.9.0",
    "tiktoken==0.13.0",
    "requests==2.34.2",
    "llama-cpp-python==0.3.16",

    # API development
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
# Quantization tail, isolated so its heavy transitive pins (nemo-toolkit)
# cannot block resolution or upgrades of the core environment
quant = [
    # nemo-toolkit held at 2.1.0: it is the last release that leaves protobuf unpinned.
    # Every release >=2.4 hard-pins protobuf~=5.29.5, which conflicts with the core
    # tensorboard (protobuf>=6.31.1). Bumping nemo would force a core downgrade, which the
    # quant extra must never do.
    "nemo-toolkit==2.1.0",
    "rouge-score==0.1.2",
    "transformers-stream-generator==0.0.5",
    # mpmath held at 1.3.0: torch's sympy (>=1.13.3) requires mpmath<1.4.
    "mpmath==1.3.0",
    "sseclient==0.0.27",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.21",
    "mypy==2.3.0",
    "types-pyyaml==6.0.12.20250915",
    "shellcheck-py==0.11.0.1",
]

# GPU-less sandbox test extent. This is the exact dependency set a torch-free
# sandbox (coding agent, remote session) needs to collect and run the full
# suite; without it, most test files fail collection on missing imports.
# Torch-gated tests skip cleanly. Versions mirror the core/interp/training
# pins where the package is pinned there, and the uv.lock resolution
# otherwise. Install with: uv sync --group sandbox --group dev
sandbox = [
    "numpy==2.4.6",
    "omegaconf==2.3.1",
    "pyyaml==6.0.3",
    "xxhash==3.5.0",
    "tokenizers==0.22.2",
    "scikit-learn==1.9.0",
    "hydra-core==1.3.2",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "uvicorn==0.51.0",
    "requests==2.34.2",
    "gguf==0.19.0",
    # Direct pin rather than a transitive of transformers: tests/models reads
    # safetensors headers with it, and docker/agents/Dockerfile.agents bakes the
    # sandbox group into the agent image, where transformers is absent. 0.8.0 is
    # the version uv.lock already resolves, so this records the existing
    # resolution rather than moving it.
    "safetensors==0.8.0",
]

# Mechanistic interpretability tooling (interp Phase 0 I1). Requires transformers>=5.4
# (satisfied by the HF core pin); gated behind its own group so the core install stays lean.
# Notebook-support packages (plotly/ipywidgets/circuitsvis; einops/jupyterlab/matplotlib/
# pandas live in core) are folded in so the workbench image is the lockfile and notebooks
# need no in-container installs.
# docker/interp/Dockerfile.interp installs and CUDA-verifies this group.
# NOTE: pins below the first two are provisional (resolved offline); regenerate uv.lock on
# the workstation (`uv lock`) to confirm exact versions against the cu130 / torch 2.13
# / py3.12 resolution.
interp = [
    "transformer-lens==3.5.1",
    "nnsight==0.7.0",
    "nnterp==1.3.0",
    "sae-lens==6.46.0",
    # sae-bench is NOT pinned here: 0.6.0 requires datasets<4.0 and numpy<2.0,
    # incompatible with the core datasets==5.0.0 pin. SAEBench runs in its own
    # isolated venv (scripts/interp/saebench_env.sh), P4-D3 resolved decision.
    "circuitsvis==1.43.3",
    "jaxtyping==0.3.11",
    "plotly==6.9.0",
    "ipywidgets==8.1.8",
    "pynvml==12.0.0",
    # Write-back path (interp Phase 3 W1/W2): control-vector extraction and GGUF export,
    # artifact manifests. scikit-learn (probes) lives in core. xxhash repeats the training
    # group's pin (groups may overlap).
    #
    # repeng is NOT pinned here: 0.4.0 (the latest release) requires numpy<2.0 and
    # references the removed np.float_ alias, so it neither resolves nor imports against
    # the core numpy 2.x pin (KB-32, confirmed at both resolve and import time). Like
    # SAEBench (P4-D3, above), it runs in its own isolated numpy<2 venv rather than joining
    # this group; the W1 write-back path invokes it out-of-process. The isolation venv and
    # the extract_repeng refactor land together at verification step I.3.
    "gguf==0.19.0",
    "xxhash==3.5.0",
]

# Training tier (Phase 0 D1). Only libs NOT already in core dependencies live here:
# core already provides torch/torchvision (cu130), transformers, datasets, accelerate,
# peft, deepspeed, bitsandbytes, sentencepiece, wandb, mlflow, tensorboard. The CUDA-compiled
# members (flash-attn, liger-kernel, torchao) build against the cu130 torch pinned in
# [tool.uv.sources]; docker/training/Dockerfile.training builds and CUDA-verifies this group.
# Tracks the same majors as the interp tier so the two do not diverge.
# NOTE: pins below are provisional (resolved offline); regenerate uv.lock on the workstation
# (`uv lock`) to confirm exact versions against the cu130 / torch 2.13 / py3.12 resolution.
training = [
    "trl==0.24.0",
    # unsloth (the optional F3 SFT throughput backend, sft.backend=unsloth) is NOT pinned:
    # it caps transformers<=5.5.0, datasets<4.4.0, and torch<2.11.0, all below the core
    # pins, and no release (through the latest 2026.7.3) lifts them. Unlike repeng/datatrove
    # it cannot be isolated out-of-process (it patches transformers/torch inside the training
    # run), so it is dropped rather than isolated. The default and fallback backend is trl
    # (schema.py SftConfig.backend default) — a complete TRL SFTTrainer path that needs no
    # unsloth; sft.backend=unsloth requires a separately built venv on a compatible stack.
    "liger-kernel==0.6.2",
    "torchao==0.14.0",
    "flash-attn==2.8.3.post1",
    "hydra-core==1.3.2",
    # F7 lm-evaluation-harness (resolved F7 decision 4: training group, not a
    # separate image; the pinned task set lives in training/eval/tasks.yaml)
    "lm-eval==0.4.12",
    "pynvml==12.0.0",
    "psutil==7.2.2",
    "xxhash==3.5.0",
    "zstandard==0.23.0",
    # P2-D1 data pipeline (LocalPipelineExecutor, quality filters, exact and MinHash dedup,
    # fastText language id, and the spacy word tokenizer the Gopher/FineWeb filters require)
    # is NOT pinned here: datatrove 0.9.0 (the latest release, like every release) caps
    # huggingface-hub<1.0, incompatible with the core huggingface-hub 1.23.0 pin that
    # transformers 5.13.1 requires (>=1.5). No datatrove release supports hf-hub 1.x. Like
    # SAEBench (P4-D3), datatrove and its spacy filter dependency run in their own isolated
    # hf-hub<1.0 venv rather than this group; prepare_corpus invokes the pipeline
    # out-of-process (training/data/pipeline.py and contamination.py already defer every
    # datatrove import so they load without the package). The isolation venv and the
    # prepare_corpus refactor land at verification Phase 2 (P2.2).
]

[tool.uv]
package = false

# A bare `uv sync` must not be destructive. uv installs the default groups and
# *removes* everything else, so with the stock default (`dev` alone) the command
# uninstalls omegaconf, hydra-core, gguf, and xxhash -- after which every
# tests/training module fails collection on a missing import -- and against a
# full environment it would also drop torch and flash-attn, whose rebuild costs
# hours. Naming all four groups makes the reflexive repair command safe in every
# tier, which is why no document has to warn about it.
# The tradeoff, deliberate: a bare `uv sync` in a torch-free worktree now
# installs torch rather than leaving it out. It adds rather than removes, and
# the tier provisioner keeps narrowing explicitly (make/agents.mk, --only-group).
# `make install` remains the fuller form: it adds --all-extras (the `quant` extra).
default-groups = ["dev", "sandbox", "interp", "training"]

# PyTorch CUDA 13.0 wheels; explicit = only packages pinned via [tool.uv.sources]
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

# deepspeed and flash-attn ship sdists whose setup.py imports torch at build time
[tool.uv.extra-build-dependencies]
deepspeed = ["torch"]
flash-attn = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/training/support.py is imported bare (`from support import ...`) by
# conftest.py and about a dozen test modules. Because tests/ and tests/training/
# both carry __init__.py, pytest's default prepend import mode walks up to the
# first directory without one -- the repo root -- and puts that on sys.path, so
# tests/training itself is never importable and collection fails before any test
# runs. Adding it here keeps the existing bare-import convention rather than
# rewriting every module to `from tests.training.support import ...`.
pythonpath = ["tests/training"]
# Hardware tiers are deselected by default: sandbox behavior is unchanged and
# the workstation opts in with -m hw_smoke / -m hw_full (a command-line -m
# replaces this one). Every tests/hardware/ test carries exactly one tier
# marker and at least one resource marker.
addopts = "-m 'not hw_smoke and not hw_full'"
markers = [
    "hw_smoke: workstation smoke tier — under five minutes total, no model downloads, temporary-directory writes only; the before-every-session gate",
    "hw_full: workstation full tier — may allocate near-capacity VRAM/RAM/disk and load real models; run per verification phase and after environment changes",
    "gpu: exercises the RTX 5090 (CUDA, VRAM, GPU-adjacent extensions)",
    "cpu: exercises the Ryzen 9950X (AVX-512, CPUAdam, affinity)",
    "ram: exercises host memory (huge pages, pinned buffers, replay residency)",
    "ssd: exercises /mnt/ai-data and staging (mounts, throughput, preflights)",
]

[tool.mypy]
# Bare `uv run mypy` checks the three first-party packages; used by `make quality`.
files = ["training", "interp", "common"]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_configs = true
# warn_unused_ignores stays off: ignores differ between the sandbox (CUDA
# libraries absent) and the workstation (present), and the run must be clean
# in both environments.
warn_unused_ignores = false

# Untyped or environment-absent third-party libraries. Two cases: the CUDA
# stack is not installable in the sandbox, and the training/interp data and
# config libraries (numpy, omegaconf, hydra, xxhash, gguf, huggingface_hub,
# requests) are absent from the dev-only sandbox venv; most ship no stubs
# regardless. Ignore missing imports per module rather than globally so
# first-party import errors still surface. This is a no-op on the workstation
# where the typed members (numpy, omegaconf, huggingface_hub) are installed.
[[tool.mypy.overrides]]
module = [
    "bitsandbytes.*",
    "datasets.*",
    "datatrove.*",
    "deepspeed.*",
    "flash_attn.*",
    "gguf.*",
    "huggingface_hub.*",
    "hydra.*",
    "lm_eval.*",
    "mlflow.*",
    "nnsight.*",
    "numpy.*",
    "omegaconf.*",
    "peft.*",
    "psutil.*",
    "pynvml.*",
    "repeng.*",
    "requests.*",
    "sae_lens.*",
    "safetensors.*",
    "sklearn.*",
    "tokenizers.*",
    "torch.*",
    "torchao.*",
    "transformer_lens.*",
    "transformers.*",
    "trl.*",
    "unsloth.*",
    "wandb.*",
    "xxhash.*",
]
ignore_missing_imports = true

[tool.coverage.run]
# Host-side-by-design modules are excluded so the sandbox coverage number
# reflects sandbox-testable code: __main__.py stubs only dispatch, and the
# smoke tests exercise GPU containers.
omit = [
    "*/__main__.py",
    "*/commands/smoke_test.py",
]

[tool.coverage.report]
# Ratchet: one point below the measured sandbox total (84.70% after the
# observability verification campaign; common 93.98%, interp 92.87%,
# training 80.68%). Raise as coverage grows; never lower to admit a
# regression.
fail_under = 83.70

[tool.ruff]
line-length = 88
target-version = "py312"
# Vendored from llama.cpp; keep upstream style to ease future diffs
exclude = ["scripts/benchmark/server-bench.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "W293",  # blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

# Declare the repository's own packages so isort's first-party/third-party
# section split is deterministic. Without this ruff auto-detects first-party,
# and the result depends on the environment: an import ruff cannot resolve in a
# given venv (for example trl or datasets in a partial sync) is categorized
# differently than in a full install, which reorders function-local import
# blocks and fails `make quality` in one environment but passes in another.
[tool.ruff.lint.isort]
known-first-party = ["training", "interp", "common"]
