# Log triage stack: MongoDB 8.2 with MongoDB Search, and two llama.cpp servers.
#
# Started explicitly (`make logtriage-up`), never on boot, like the interp stack.
# Every port binds to 127.0.0.1: mongod holds a copy of whatever logs were
# ingested, which is production data by definition, and the search and inference
# servers are unauthenticated by design.
#
# The four services are two pairs. mongod and mongot are one deployment split
# across two containers -- MongoDB Search is not part of Community Edition and
# ships as its own image, so mongod is told where to find it rather than
# starting it. The two llama-servers are separate processes because llama.cpp's
# --embedding mode replaces the chat endpoints rather than adding to them: one
# server cannot serve both.
#
# Deployment follows the procedure in the MongoDB Database Manual at
# includes/search-in-community/docker-deploy-procedure.rst (corpus commit
# 88ec8192b924). Two steps in it are imperative and cannot be expressed here --
# initiating the replica set, and creating the mongot user with the
# searchCoordinator role -- so they live in scripts/logtriage/bootstrap.sh and
# run once, after the first `make logtriage-up`.
#
# Images are pinned by manifest-list digest, which resolves on both amd64 (the
# workstation) and arm64 (the MacBook). Both were checked to publish the pair.

services:
  logtriage-mongo:
    # 8.2 is the floor, not a preference: MongoDB Search on a self-managed
    # deployment requires 8.2.0 or later. The non-slim variant is deliberate --
    # the slim images omit mongosh, and the healthcheck below is a mongosh call.
    image: mongodb/mongodb-community-server:8.2.12-ubuntu2204@sha256:ce9429b03cdf1156891c192e1e702d0475c2c9ace5bb5d80496b55ccd63a4acf
    container_name: logtriage-mongo
    restart: "no"  # started explicitly, never on boot
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${LOGTRIAGE_MONGO_ROOT_USER:-logtriage}
      - MONGODB_INITDB_ROOT_PASSWORD=${LOGTRIAGE_MONGO_ROOT_PASSWORD:?set this in the compose secrets file}
    # --replSetMember names the host mongot will be told to sync from. It must
    # match the address in mongot.conf's syncSource, and it must be the compose
    # service name rather than localhost: the two processes are in different
    # network namespaces.
    command:
      - --config
      - /etc/mongod.conf
      - --replSetMember=logtriage-mongo:27017
    ports:
      - "127.0.0.1:27017:27017"
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    volumes:
      - ./docker/logtriage/mongod.conf:/etc/mongod.conf:ro
      # Shared with mongot, and the reason the two containers trust each other.
      # Generated by `make logtriage-secrets`; never committed.
      - ./.secrets/logtriage/keyfile:/keyfile:ro
      - logtriage-mongo-data:/data/db
      - logtriage-mongo-config:/data/configdb
    networks:
      - logtriage-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  logtriage-mongot:
    # mongot versions independently of the server; 1.70.4 is the release current
    # at the time of writing, and there is no 8.2-shaped tag to match against.
    image: mongodb/mongodb-community-search:1.70.4@sha256:63ebc805c6b55d027e345b5224d8713009f21911aedafb50b6c28c1cd9583e4f
    container_name: logtriage-mongot
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      logtriage-mongo:
        condition: service_healthy
    ports:
      # The gRPC query port (27028) is deliberately absent. mongod reaches it
      # over the compose network, and the manual warns that exposing the query
      # server beyond a trusted interface risks unauthorized access.
      - "127.0.0.1:8008:8080"   # health: curl -> SERVING | NOT_SERVING
      - "127.0.0.1:9946:9946"   # prometheus metrics
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    volumes:
      - ./docker/logtriage/mongot.conf:/mongot-community/config.default.yml:ro
      - ./.secrets/logtriage/passwordFile:/passwordFile:ro
      - logtriage-mongot-data:/data/mongot
    networks:
      - logtriage-network
    healthcheck:
      # The endpoint answers SERVING as soon as the process is up, which is not
      # the same as being able to serve queries -- an index must reach Ready
      # first. Treat a healthy container as "mongot is alive", nothing more.
      # Addressed by service name, not localhost: healthCheck.address in
      # mongot.conf binds the container's own network address, so a loopback
      # request from inside the container reaches no socket.
      test: ["CMD-SHELL", "curl -sf http://logtriage-mongot:8080/health | grep -q SERVING"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  logtriage-llm:
    build:
      context: .
      dockerfile: docker/llama-gpu/Dockerfile.llama-gpu
    container_name: logtriage-llm
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - SERVER_PORT=8006
      - MODEL_PATH=${LOGTRIAGE_LLM_MODEL}
      # Tool calling is a server feature, not a model one: llama-server parses
      # the model's tool-call syntax against its chat template and returns
      # structured calls. Without the template the triage loop gets prose that
      # looks like a tool call and no tool is ever invoked, so this must be on.
      - JINJA_ENABLED=true
      # Gemma emits a thinking channel. Left empty here because whether it
      # leaks into content against the official template is unmeasured -- see
      # logtriage/docs/verification/desktop.md. Set once that is answered.
      - REASONING_FORMAT=${LOGTRIAGE_REASONING_FORMAT:-}
      # The triage loop sends a whole log profile plus retrieved documentation.
      - CTX_SIZE=${LOGTRIAGE_LLM_CTX:-32768}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      - "127.0.0.1:8006:8006"
    read_only: true
    tmpfs:
      - /tmp:size=4G,mode=1777  # CUDA cache
    volumes:
      - /mnt/ai-data/models/:/app/models:ro
    networks:
      - logtriage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # a 31B model has to reach VRAM first

  logtriage-embed:
    build:
      context: .
      dockerfile: docker/llama-gpu/Dockerfile.llama-gpu
    container_name: logtriage-embed
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - SERVER_PORT=8007
      - MODEL_PATH=${LOGTRIAGE_EMBED_MODEL}
      # --embedding replaces the chat endpoints rather than adding to them,
      # which is why this is a second container and not a second port.
      - EMBEDDING=true
      - POOLING=${LOGTRIAGE_EMBED_POOLING:-mean}
      # Chunks are capped at MAX_TOKENS by the chunker; this only needs to
      # exceed that, and a large context on an embedding model wastes VRAM the
      # 31B beside it needs.
      - CTX_SIZE=${LOGTRIAGE_EMBED_CTX:-8192}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      - "127.0.0.1:8007:8007"
    read_only: true
    tmpfs:
      - /tmp:size=2G,mode=1777
    volumes:
      - /mnt/ai-data/models/:/app/models:ro
    networks:
      - logtriage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  logtriage-mongo-data:
  logtriage-mongo-config:
  logtriage-mongot-data:

networks:
  logtriage-network:
    driver: bridge
