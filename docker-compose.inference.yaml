services:
  llama-cpu:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 96G
    build:
      context: .
      dockerfile: docker/llama-cpu/Dockerfile.cpu
    container_name: llama-cpu
    restart: unless-stopped
    cpuset: "0-15"
    environment:
      - SERVER_PORT=8001
      - MODEL_PATH=${LLAMA_CPU_MODEL:-${LLAMA_ZEN5_MODEL}}
      # Interpolated, not literal, because `bench run --arm t12:THREADS=12` sets this in
      # the compose subprocess environment and a literal would swallow it -- both arms
      # would run 16 and the comparison would report a clean null on an A/B that measured
      # nothing. The two stay independent rather than the batch size defaulting to the
      # thread count, because they drive different llama-server flags -- --threads is the
      # decode lever and --threads-batch the prompt-processing one -- so an arm that means
      # to move both says so (`--arm t12:THREADS=12,THREADS_BATCH=12`).
      - THREADS=${THREADS:-16}
      - THREADS_BATCH=${THREADS_BATCH:-16}
      # Weight repacking (docker/llama-cpu/entrypoint.cpu.sh) as an A/B arm. The
      # entrypoint has always read NO_REPACK; without this line the variable never
      # crossed into the container and the arm was inert.
      - NO_REPACK=${NO_REPACK:-true}
      # Hugepage wrapper (docker/llama-cpu/entrypoint.cpu.sh) as an A/B arm rather than a
      # constant: HUGEPAGES=off runs the same image without the LD_PRELOAD, which is the
      # control arm `python -m bench` compares against.
      - HUGEPAGES=${HUGEPAGES:-on}
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    volumes:
      - /mnt/ai-data/models/:/app/models:ro
      # Wikitext-2 corpus for scripts/benchmark/test_perplexity.sh, mounted from the
      # committed copy; the script reads the same directory on the host
      - ./scripts/benchmark/datasets:/app/datasets:ro
      - /sys:/sys:ro
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  llama-gpu:
    init: true  # Use tini as PID 1 for proper signal forwarding (required for nsys)
    user: "${UID:-1000}:${GID:-1000}"  # Match host user for volume write access (nsys)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: docker/llama-gpu/Dockerfile.llama-gpu
    container_name: llama-gpu
    restart: unless-stopped
    # runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - SERVER_PORT=8002
      - MODEL_PATH=${LLAMA_GPU_MODEL}
      # Nsight Systems profiling (set NSYS_PROFILE=true to enable)
      - NSYS_PROFILE=${NSYS_PROFILE:-false}
      - NSYS_OUTPUT=${NSYS_OUTPUT:-/app/nsys_output/profile}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      # GPU API port binding
      - "127.0.0.1:8002:8002"
    read_only: true
    tmpfs:
      - /tmp:size=4G,mode=1777  # CUDA cache and temp files
    volumes:
      # Model storage mount
      - /mnt/ai-data/models/:/app/models:ro
      # Nsys profiling output (only used when NSYS_PROFILE=true)
      - /mnt/ai-data/benchmarks/nsys:/app/nsys_output
    networks:
      - ai-network
    healthcheck:
      # Service health monitoring
      test: ["CMD", "curl", "-f", "http://localhost:8002/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s # Give the GPU model time to load into VRAM

  # vLLM GPU Service - Optimized for RTX 5090
  # Note: No memlock/IPC_LOCK needed - vLLM uses pure GPU inference (PagedAttention in VRAM)
  vllm-gpu:
    init: true  # Use tini as PID 1 for proper signal forwarding (required for nsys)
    user: "${UID:-1000}:${GID:-1000}"  # Match host user for volume write access (nsys)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: docker/vllm-gpu/Dockerfile.vllm-gpu
    container_name: vllm-gpu
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_PATH=${VLLM_GPU_MODEL}
      # Nsight Systems profiling (set NSYS_PROFILE=true to enable)
      - NSYS_PROFILE=${NSYS_PROFILE:-false}
      - NSYS_OUTPUT=${NSYS_OUTPUT:-/app/nsys_output/profile}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      # vLLM API port binding
      - "127.0.0.1:8003:8003"
    read_only: true
    tmpfs:
      - /tmp:size=4G,mode=1777  # For CUDA cache and temp files
      - /app/.cache:size=1G,mode=1777  # vLLM model info cache
      - /app/cache:size=2G,mode=1777   # HuggingFace cache (HF_HOME)
      - /app/.config:size=100M,mode=1777  # vLLM usage stats
      - /app/.triton:size=2G,mode=1777,exec  # Triton compilation cache
    volumes:
      # Model storage mount
      - /mnt/ai-data/models/:/app/models:ro
      # Nsys profiling output (only used when NSYS_PROFILE=true)
      - /mnt/ai-data/benchmarks/nsys:/app/nsys_output
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s # vLLM needs time to load the model

  
  # Open WebUI Service
  open-webui:
    # Pinned to the stable release channel by digest (immutable). Re-resolve with
    # `docker buildx imagetools inspect ghcr.io/open-webui/open-webui:latest` to update.
    image: ghcr.io/open-webui/open-webui:latest@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0
    container_name: open-webui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:8080" # Access WebUI from http://localhost:3000 (localhost only)
    read_only: true
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - ai-network
    # Backend service configuration
    environment:
      # API endpoint configuration
      - 'OPENAI_API_BASE_URL=http://llama-gpu:8002/v1'
      # Internal API access
      - 'OPENAI_API_KEY=NONE'
      # Model configuration import
      - 'WEBUI_IMPORTS=[{"name":"qwen3 coder","model":"qwen3 coder","baseURL":"http://llama-gpu:8002/v1","apiKey":"NONE"}]'
      # WEBUI_SECRET_KEY intentionally unset: open-webui auto-generates a strong key
      # and persists it to the data volume. Do not set a literal key in this file.
    # depends_on:
    #   llama-gpu:
    #     condition: service_healthy # Wait for the GPU service to be healthy before starting

# Persistent storage
volumes:
  open-webui-data:

# Service network
networks:
  ai-network:
    driver: bridge
    internal: false # Set to false to allow pulling images, can be true in production
    ipam:
      config:
        - subnet: 172.20.0.0/16


