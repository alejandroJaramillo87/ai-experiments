services:
  llama-cpu:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 96G
    build:
      context: .
      dockerfile: docker/llama-cpu/Dockerfile.cpu
    container_name: llama-cpu
    restart: unless-stopped
    cpuset: "0-15"
    environment:
      - SERVER_PORT=8001
      - MODEL_PATH=${LLAMA_CPU_MODEL:-${LLAMA_ZEN5_MODEL}}
      - THREADS=16
      - THREADS_BATCH=16
      # Steering control vector (interp Phase 3 W1); empty defaults keep behavior unchanged
      - CONTROL_VECTOR=${CONTROL_VECTOR:-}
      - CONTROL_VECTOR_SCALE=${CONTROL_VECTOR_SCALE:-}
      - CONTROL_VECTOR_LAYER_RANGE=${CONTROL_VECTOR_LAYER_RANGE:-}
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    volumes:
      - /mnt/ai-data/models/:/app/models:ro
      # Control-vector GGUFs (interp Phase 3 W1); read-only like the models mount
      - /mnt/ai-data/interp/vectors:/app/vectors:ro
      # Wikitext-2 corpus for scripts/benchmark/test_perplexity.sh, mounted from the
      # committed copy; the script reads the same directory on the host
      - ./scripts/benchmark/datasets:/app/datasets:ro
      - /sys:/sys:ro
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  llama-gpu:
    init: true  # Use tini as PID 1 for proper signal forwarding (required for nsys)
    user: "${UID:-1000}:${GID:-1000}"  # Match host user for volume write access (nsys)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: docker/llama-gpu/Dockerfile.llama-gpu
    container_name: llama-gpu
    restart: unless-stopped
    # runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - SERVER_PORT=8002
      - MODEL_PATH=${LLAMA_GPU_MODEL}
      # Nsight Systems profiling (set NSYS_PROFILE=true to enable)
      - NSYS_PROFILE=${NSYS_PROFILE:-false}
      - NSYS_OUTPUT=${NSYS_OUTPUT:-/app/nsys_output/profile}
      # Steering control vector (interp Phase 3 W1); empty defaults keep behavior unchanged
      - CONTROL_VECTOR=${CONTROL_VECTOR:-}
      - CONTROL_VECTOR_SCALE=${CONTROL_VECTOR_SCALE:-}
      - CONTROL_VECTOR_LAYER_RANGE=${CONTROL_VECTOR_LAYER_RANGE:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      # GPU API port binding
      - "127.0.0.1:8002:8002"
    read_only: true
    tmpfs:
      - /tmp:size=4G,mode=1777  # CUDA cache and temp files
    volumes:
      # Model storage mount
      - /mnt/ai-data/models/:/app/models:ro
      # Control-vector GGUFs (interp Phase 3 W1); read-only like the models mount
      - /mnt/ai-data/interp/vectors:/app/vectors:ro
      # Nsys profiling output (only used when NSYS_PROFILE=true)
      - /mnt/ai-data/benchmarks/nsys:/app/nsys_output
    networks:
      - ai-network
    healthcheck:
      # Service health monitoring
      test: ["CMD", "curl", "-f", "http://localhost:8002/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s # Give the GPU model time to load into VRAM

  # Full-precision serving endpoint for monitored interpretability traffic (interp Phase 3 W4).
  # Opt-in via the "interp" profile; production port 8002 and its quantized model are untouched.
  #
  # Why this exists: probes are fitted on bf16 activations, so replaying prompts that a quantized
  # model answered measures a different model than the one that served. This endpoint removes
  # that seam by answering monitored traffic at the same precision the probes were fitted at.
  #
  # Serves the interpretability subject model, not the production model: gpt-oss-20b at full
  # precision is roughly 40GB and exceeds the 32GB VRAM budget, while Gemma-2-2B is about 5.2GB
  # and is what the W2 probes are actually trained on.
  #
  # Reuses the llama-gpu image unchanged; entrypoint.sh parameterizes SERVER_PORT and MODEL_PATH.
  llama-gpu-bf16:
    profiles: ["interp"]
    init: true  # tini as PID 1 for proper signal forwarding
    user: "${UID:-1000}:${GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: docker/llama-gpu/Dockerfile.llama-gpu
    container_name: llama-gpu-bf16
    restart: "no" # opt-in workbench service, never on boot
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - SERVER_PORT=8004
      - MODEL_PATH=${LLAMA_GPU_BF16_MODEL:-/app/models/gguf/gemma-2-2b-GGUF/gemma-2-2b-bf16.gguf}
      # No CONTROL_VECTOR here: steering is a production-path concern (W1). A steered monitored
      # endpoint would score probes against activations the probes were not fitted against.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      - "127.0.0.1:8004:8004"
    read_only: true
    tmpfs:
      - /tmp:size=4G,mode=1777  # CUDA cache and temp files
    volumes:
      - /mnt/ai-data/models/:/app/models:ro
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # vLLM GPU Service - Optimized for RTX 5090
  # Note: No memlock/IPC_LOCK needed - vLLM uses pure GPU inference (PagedAttention in VRAM)
  vllm-gpu:
    init: true  # Use tini as PID 1 for proper signal forwarding (required for nsys)
    user: "${UID:-1000}:${GID:-1000}"  # Match host user for volume write access (nsys)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: docker/vllm-gpu/Dockerfile.vllm-gpu
    container_name: vllm-gpu
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_PATH=${VLLM_GPU_MODEL}
      # Nsight Systems profiling (set NSYS_PROFILE=true to enable)
      - NSYS_PROFILE=${NSYS_PROFILE:-false}
      - NSYS_OUTPUT=${NSYS_OUTPUT:-/app/nsys_output/profile}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      # vLLM API port binding
      - "127.0.0.1:8003:8003"
    read_only: true
    tmpfs:
      - /tmp:size=4G,mode=1777  # For CUDA cache and temp files
      - /app/.cache:size=1G,mode=1777  # vLLM model info cache
      - /app/cache:size=2G,mode=1777   # HuggingFace cache (HF_HOME)
      - /app/.config:size=100M,mode=1777  # vLLM usage stats
      - /app/.triton:size=2G,mode=1777,exec  # Triton compilation cache
    volumes:
      # Model storage mount
      - /mnt/ai-data/models/:/app/models:ro
      # Nsys profiling output (only used when NSYS_PROFILE=true)
      - /mnt/ai-data/benchmarks/nsys:/app/nsys_output
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s # vLLM needs time to load the model

  
  # Open WebUI Service
  open-webui:
    # Pinned to the stable release channel by digest (immutable). Re-resolve with
    # `docker buildx imagetools inspect ghcr.io/open-webui/open-webui:latest` to update.
    image: ghcr.io/open-webui/open-webui:latest@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0
    container_name: open-webui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:8080" # Access WebUI from http://localhost:3000 (localhost only)
    read_only: true
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - ai-network
    # Backend service configuration
    environment:
      # API endpoint configuration
      - 'OPENAI_API_BASE_URL=http://llama-gpu:8002/v1'
      # Internal API access
      - 'OPENAI_API_KEY=NONE'
      # Model configuration import
      - 'WEBUI_IMPORTS=[{"name":"qwen3 coder","model":"qwen3 coder","baseURL":"http://llama-gpu:8002/v1","apiKey":"NONE"}]'
      # WEBUI_SECRET_KEY intentionally unset: open-webui auto-generates a strong key
      # and persists it to the data volume. Do not set a literal key in this file.
    # depends_on:
    #   llama-gpu:
    #     condition: service_healthy # Wait for the GPU service to be healthy before starting

  # ComfyUI for image (FLUX.2) and video (Wan 2.2, LTX-2.3) generation
  comfyui:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: docker/comfyui/Dockerfile.comfyui
    container_name: comfyui
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - COMFYUI_PORT=8188
      - MODEL_BASE_PATH=/app/models
      - OUTPUT_PATH=/app/output
      - VRAM_MODE=${COMFY_VRAM_MODE:-highvram}
    deploy:
      resources:
        limits:
          # Video models spill weights to system RAM when a clip exceeds
          # 32GB VRAM (e.g. LTX-2.3 weight streaming); leave headroom
          memory: 64G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    ports:
      # ComfyUI web interface
      - "127.0.0.1:8188:8188"
    # read_only disabled as ComfyUI needs write access for manager and settings
    # Security maintained through: non-root user, resource limits, network isolation
    tmpfs:
      - /tmp:size=4G,mode=1777
      # Video frame intermediates need more temp space than image runs
      - /app/temp:size=8G,mode=1777
      - /app/input:size=1G,mode=1777
      - /app/.cache:size=1G,mode=1777
      - /app/user:size=100M,mode=1777
    volumes:
      # Model storage mount
      - /mnt/ai-data/models:/app/models:ro
      # Output directory for generated images
      - /mnt/ai-data/comfyui/output:/app/output
      # ComfyUI workflows
      - ./workflows:/app/user/default/workflows
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Serving request log proxy (interp Phase 3 W3). Opt-in via the "interp" profile:
  # `make logproxy-up` starts it in front of llama-gpu on 127.0.0.1:8012 and clients that
  # want their traffic logged point at it. Production ports and default behavior are
  # untouched; this is a UX guardrail for the single-user threat model, not an auth
  # boundary. One JSONL record per completed request lands under /mnt/ai-data/interp/logs.
  interp-logproxy:
    profiles: ["interp"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: docker/interp-logproxy/Dockerfile
    container_name: interp-logproxy
    restart: "no" # opt-in sidecar, never on boot
    user: "${UID:-1000}:${GID:-1000}" # match host user for log-dir writes
    read_only: true
    environment:
      - TARGET_URL=${LOGPROXY_TARGET_URL:-http://llama-gpu:8002}
      - TARGET_SERVICE=${LOGPROXY_TARGET_SERVICE:-llama-gpu}
      - LISTEN_PORT=8012
      - LOG_DIR=/logs
    ports:
      - "127.0.0.1:8012:8012"
    volumes:
      - /mnt/ai-data/interp/logs:/logs:rw
    networks:
      - ai-network

# Persistent storage
volumes:
  open-webui-data:

# Service network
networks:
  ai-network:
    driver: bridge
    internal: false # Set to false to allow pulling images, can be true in production
    ipam:
      config:
        - subnet: 172.20.0.0/16


