# docker-compose.training.yaml
#
# Phase 0 training tier (roadmap D1). Kept in a separate compose file so `make up` never
# starts it: training and inference must not run concurrently (one GPU consumer at a time,
# per AGENTS.md). Invoke via `make train-build` / `make train-shell` / `make train-smoke`, or
# directly with `docker compose -f docker-compose.training.yaml run --rm training <cmd>`.
#
# This mirrors the docker-compose.agents.yaml precedent (separate file, run-not-up). It is not a
# long-running server: no published port and no healthcheck; it runs batch or interactive jobs.

services:
  training:
    build:
      context: .
      dockerfile: docker/training/Dockerfile.training
      # Cap build-time compile parallelism (default 16 of the 9950X's 32 threads). Override per
      # run: MAX_JOBS=8 make train-build. See docker/training/Dockerfile.training.
      args:
        MAX_JOBS: "${MAX_JOBS:-16}"
        NVCC_THREADS: "${NVCC_THREADS:-1}"
    container_name: training
    restart: "no"  # batch job runner, not a service
    init: true  # tini as PID 1 for correct signal forwarding
    user: "${UID:-1000}:${GID:-1000}"  # match host user for /mnt/ai-data/training writes
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # Secrets (WANDB_API_KEY, HF_TOKEN) from an untracked per-tier file; template
    # is env.training.example (roadmap D6). Optional: public models and offline
    # tracking need no secrets.
    env_file:
      - path: .env.training
        required: false
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      # Optional D9 LD_PRELOAD interposer hook (empty by default)
      - TRAIN_LD_PRELOAD=${TRAIN_LD_PRELOAD:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    shm_size: "16g"  # dataloader worker shared memory
    tmpfs:
      - /tmp:size=8G,mode=1777,exec  # Triton/CUDA JIT caches require exec
      - /app/cache:size=2G,mode=1777  # HuggingFace cache (HF_HOME)
      # RAM-disk shard staging (roadmap D9): sized to match staging.max_gb
      - /staging:size=${TRAIN_STAGING_GB:-32}G,mode=1777
    volumes:
      # Base models mounted read-only, exactly as the inference services mount them
      - /mnt/ai-data/models/:/app/models:ro
      # Writable training root: datasets, shards, checkpoints, run outputs (roadmap D1)
      - /mnt/ai-data/training:/mnt/ai-data/training:rw
      # Narrow rw window into the models tree for exported GGUFs (roadmap D7); the rest
      # of /app/models stays read-only via the mount above
      - /mnt/ai-data/models/trained:/app/models/trained:rw
      # Repository sources (recipes, training package, scripts) mounted live for iteration
      - ./scripts:/app/scripts:ro
      - ./training:/app/training:ro
      # Shared helpers (common.output Printer) imported by training/cli.py at module scope
      - ./common:/app/common:ro
      - ./logs/training:/app/logs
    networks:
      - training-network

  # GGUF export toolchain (roadmap D7). Separate image by design: the training image is
  # never reused to prepare a model for inference. CPU-only batch job, no GPU reservation.
  export:
    build:
      context: .
      dockerfile: docker/training/Dockerfile.export
      # Cap the llama.cpp compile parallelism (default 16). Override: MAX_JOBS=8 make export-build.
      args:
        MAX_JOBS: "${MAX_JOBS:-16}"
    container_name: training-export
    restart: "no"  # batch job runner, not a service
    init: true
    user: "${UID:-1000}:${GID:-1000}"  # match host user for export/staging writes
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # HF_TOKEN needed only when an adapter merge pulls a gated base model from the hub
    env_file:
      - path: .env.training
        required: false
    tmpfs:
      - /tmp:size=2G,mode=1777
      - /app/cache:size=8G,mode=1777  # HF cache for adapter-merge base downloads
    volumes:
      # Base models read-only, exactly as the inference services mount them
      - /mnt/ai-data/models/:/app/models:ro
      # Narrow rw window for exported GGUFs (resolved D7 decision 1)
      - /mnt/ai-data/models/trained:/app/models/trained:rw
      # Checkpoints to export and the on-disk staging area (large intermediates)
      - /mnt/ai-data/training:/mnt/ai-data/training:rw
      # Repository sources mounted live for iteration
      - ./scripts:/app/scripts:ro
      - ./training:/app/training:ro
      # Shared helpers (common.output Printer) imported by training/cli.py at module scope
      - ./common:/app/common:ro
      - ./logs/training:/app/logs
    networks:
      - training-network

# Self-contained network: training runs jobs, not a server, and never runs alongside the
# inference stack, so it does not join ai-network.
networks:
  training-network:
    driver: bridge
