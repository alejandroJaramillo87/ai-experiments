# docker-compose.agents.yaml
#
# Containment for coding-agent sessions (OpenCode + Claude Code). Kept in a
# separate compose file so `make up` never starts it; invoke via
# `make agent-sandbox` (see the Makefile) or `docker compose -f
# docker-compose.agents.yaml run --rm agent ...`.
#
# The security boundary is OS-level, not the CLI permission rules:
#   - the `agent` service sits on an internal:true network with NO route to the
#     internet except the proxy; the proxy allowlists egress by domain.
#   - the rootfs is read-only; only a bind-mounted git worktree and tmpfs caches
#     are writable, so a compromised session's damage is git-recoverable.
#   - no GPU, no host credential mounts; exactly one scoped key is injected.
# See docs/sandbox/agent-sandbox.md for the full model.

services:
  # Allowlisting egress proxy. On both networks: it has real internet via
  # agent-egress and is reachable from the sandbox via agent-internal.
  agent-proxy:
    build:
      context: .
      dockerfile: docker/agents/proxy/Dockerfile.proxy
    container_name: agent-proxy
    hostname: agent-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # squid binds low internal port 3128 and needs setuid for its helper user.
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    # Bounded because this is the container with real internet: an unbounded
    # proxy defeats the point of bounding the thing it proxies for. squid needs
    # very little here -- it caches nothing (cache deny all) and its spool and
    # log directories are the 64M/32M tmpfs below.
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256
    tmpfs:
      - /var/spool/squid:size=64M,mode=1777
      - /var/log/squid:size=32M,mode=1777
      - /var/run:size=16M,mode=1777
    networks:
      - agent-internal
      - agent-egress
    restart: "no"

  # The agent session container. One session per `run --rm`.
  agent:
    build:
      context: .
      dockerfile: docker/agents/Dockerfile.agents
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # Writable surfaces: the bind-mounted worktree (below) plus ephemeral tmpfs
    # for the home dir and package-manager caches. Nothing else can be written.
    #
    # noexec/nosuid/nodev are Docker's defaults for tmpfs, but they are spelled
    # out because they are load-bearing rather than incidental: tests/conftest.py
    # relocates pytest's tmp_path base after probing for them, and AGENTS.md tells
    # agents to build under /work because nothing else here can execute. A future
    # switch to the long-form mount syntax would drop them silently.
    tmpfs:
      - /home/node:size=256M,mode=0700,uid=1000,gid=1000,noexec,nosuid,nodev
      # /tmp also holds CARGO_HOME, seeded from the image's prefetched registry:
      # the .crate cache plus the sources cargo extracts from it. 1G left no
      # headroom once the workspace's dependency tree unpacked. Build artifacts
      # are not here - target/ defaults into the bind-mounted worktree.
      - /tmp:size=4G,mode=1777,noexec,nosuid,nodev
      # Masks the worktree's .venv, which belongs to the workstation: it arrives
      # over the bind mount pointing at a host interpreter that does not exist in
      # this container, and a sync against it would write back through the mount
      # to the workstation.
      #
      # Observed effect, not the intended-by-design one: `uv run` here creates a
      # throwaway venv on this tmpfs and resolves the tool from /opt/pyenv on
      # PATH, so it succeeds at the pinned version and the write never leaves the
      # container. Small on purpose -- an actual install would exhaust it and say
      # so, rather than quietly building a second environment over the mount.
      - /work/.venv:size=16M,mode=0755,uid=1000,gid=1000,noexec,nosuid,nodev
    # 8G covers editing, linting, and the rust gate against the tiny fixture. The
    # CPU backend dequantizes every tensor to f32 at load, so a real checkpoint
    # costs far more than its on-disk size: E2B's body plus main embedding is
    # roughly 2.28B parameters (~9.1GB as f32) and E4B's roughly 4.67B (~18.7GB),
    # before the KV cache, which this backend keeps at full sequence length for
    # every layer. 32G fits E4B with headroom and still leaves the 128GB host
    # three quarters free. Raise deliberately; a runaway session can claim all of
    # this.
    # CPU is capped for a bug rather than an attack: a runaway `cargo build -j`
    # should degrade the session, not the workstation -- and an unattended
    # session is exactly when that would happen. 24 of the 9950X's 32 threads
    # leaves the host responsive while keeping the rust gate well parallelised.
    #
    # pids is the fork-bomb ceiling, on the same reasoning.
    #
    # All three live under `deploy` rather than the short `cpus:`/`pids_limit:`
    # forms because compose refuses to see both spellings in one service --
    # "can't set distinct values on 'cpus' and 'deploy.resources.limits.cpus'" --
    # and memory was already here. One mechanism per service, so adding the next
    # limit cannot reintroduce that error.
    deploy:
      resources:
        limits:
          memory: 32G
          cpus: "24.0"
          pids: 4096
    # Only the git worktree is mounted, read-write. AGENT_WORKTREE is set by the
    # make wrapper to ../ai-experiments-<name>; damage stays inside that worktree.
    #
    # Required, with no default: a bare `docker compose run agent` outside the
    # wrapper would otherwise fall back to the current directory and mount the
    # repository root, .env included. The build and teardown targets in
    # make/agents.mk pass a placeholder, since neither uses this mount.
    volumes:
      - ${AGENT_WORKTREE:?set by make agent-sandbox NAME=<name>; see docs/agents/README.md}:/work:rw
    environment:
      # Exactly one scoped secret is populated by the wrapper; the other stays
      # empty. Claude Code sessions carry a subscription OAuth token minted by
      # `claude setup-token` on the host (no API key, no ~/.claude mount);
      # OpenCode sessions carry a RunPod key. Neither gets the other's secret.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      # Terminal fidelity only (truecolor rendering); no security effect.
      - TERM=${TERM:-xterm-256color}
      - COLORTERM=${COLORTERM:-truecolor}
    # agent-internal is internal:true => no direct egress; the proxy is the only
    # way out. This is the enforcement, not the HTTP_PROXY env in the image.
    networks:
      - agent-internal
    depends_on:
      - agent-proxy
    working_dir: /work
    restart: "no"
    # Overridden by the run command (claude ... / opencode ...).
    command: ["bash"]

networks:
  # No internet: containers here reach only each other. Fixed subnet so the
  # proxy's squid.conf localnet ACL (172.31.0.0/16) matches. Because the subnet is
  # fixed, only one compose project may hold this network at a time: the make
  # wrapper pins the project (AGENTS_PROJECT=ai-agents) rather than letting it
  # default to the per-worktree directory basename, which would collide across
  # worktrees with "Pool overlaps with other one on this address space".
  agent-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/16
  # Real egress, used only by the proxy.
  agent-egress:
    driver: bridge
    internal: false
